<div class="event-calendar mx-3 mt-3">
  <div
    class="table-header d-flex align-items-center justify-content-between align-content-center">
    <span style="margin-left: 11px">My Surgeries</span>
    <span style="float: right !important; cursor: pointer; margin-left: auto;"><img src="assets/img/excel.png" title="Export to excel" style="width: 20px;" (click)="exportToExcel()" [hidden]="defaultView.get('currentView').value !== 'Weekly' && defaultView.get('currentView').value !== 'Monthly'"></span>
    <span class="ml-3" style="float: right !important; cursor: pointer;"><i class="fa fa-refresh" style="font-size: 18px;" title="Refresh List" aria-hidden="true" (click)="resetfilterData()"></i></span>
    <form [formGroup]="defaultView" class="w-10 select-data">
      <ng-select
      class="m-3 surg-width su-font-size h-75 "
      formControlName="currentView" (change)="onChangeView()">
      <ng-option *ngFor="let item of surgeryView" [value]="item">{{ item }} </ng-option>
    </ng-select>
    </form>

      #inputUnit

      <option value="weeks">Weeks</option>
      <option value="months">Months</option>
    </select> -->
  </div>
  <calender-view
    [days]="days"
    [dataArray]="dataArray"
    [currentMonthYear]="currentMonthYear"
    [currentDate]="currentDate"
    [isSelected]="isSelected"
    [defaultView]="this.defaultView.get('currentView').value"
    [Time]="timeArray"
    (previousEvent)="previousDays()"
    (nextEvent)="nextDays()"
    (chooseaaaPickDate)="chooseaaaPickDate()"
  ></calender-view>
