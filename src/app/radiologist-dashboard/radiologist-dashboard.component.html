<app-my-clinic [hidden]="inPatients || patientLab || patientRad || MySurgeries || FavoritePatients || Endoscopy"
  (dataCount)="collectClinicCount($event)"></app-my-clinic>
<app-In-Patients [hidden]="myClinic || patientLab || patientRad || MySurgeries || FavoritePatients || Endoscopy || radiologistActive"
  (dataCount)="collectIPCount($event)"></app-In-Patients>
<app-patient-lab [hidden]="myClinic || inPatients || patientRad || MySurgeries || FavoritePatients || Endoscopy || radiologistActive"
  (dataCount)="collectLabCount($event)"></app-patient-lab>
<app-patient-rad [hidden]="myClinic || inPatients || patientLab || MySurgeries || FavoritePatients || Endoscopy || radiologistActive"
  (dataCount)="collectRadCount($event)"></app-patient-rad>
<my-surgeries [hidden]="myClinic || inPatients || patientLab || patientRad || FavoritePatients || Endoscopy || radiologistActive"
  (dataCount)="collectSurgeries($event)"></my-surgeries>
<div *ngIf="FavoritePatients">
  <app-my-favorite-patients></app-my-favorite-patients>
</div>
<div *ngIf="Endoscopy">
