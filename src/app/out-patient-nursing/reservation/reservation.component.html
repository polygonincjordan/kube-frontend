<div class="search-functionalitypl-0 mt-2">
    <form [formGroup]="formDetailGroup" >
     <div class=" tab-search-panel row align-items-center">
          <div [ngClass]="isConsumableAction == '1' ? 'col-2' : 'col-3'">
            <tabset>
              <tab *ngFor="let tabz of tabs" [heading]="tabz.title" [active]="tabz.active" (selectTab)="changeTab(tabz)">
                {{ tabz?.content }}
              </tab>
            </tabset>
          </div>
          <div class="col-7" *ngIf="isConsumableAction != '1'">
            <div class="w-100 d-flex">
              <div class="storage-box w-100 d-flex align-items-center">
                <label class="location-label" for="movement type ">Movement type </label>
                <ng-select class="ng-select-dropdown"  formControlName="movementType"  [placeholder]="'Movement type'" (change)="selectType($event)">
                  <ng-option *ngFor="let type of movementTypes" [value]="type.value">{{ type.label }}</ng-option>
                </ng-select>
              </div>
              <div class="storage-box w-100 d-flex align-items-center" *ngIf="selectedType == '311'">
                <label class="location-label" for="storage-location">Storage Location</label>
                <ng-select class="ng-select-dropdown" [placeholder]="'Storage Location'" [clearable]="true" [searchable]="true"
                  formControlName="selectedLocation" [(ngModel)]="selectedLocation" (change)="onLocationChange($event)">
                  <ng-option *ngFor="let item of storageLocationList" [value]="item">{{ item.Lgort }}</ng-option>
                </ng-select>
              </div>
              <div class="storage-box w-100 d-flex align-items-center" *ngIf="selectedType == '201'">
                <label class="location-label" for="Cost-Center">Cost Center</label>
                <ng-select class="ng-select-dropdown" [placeholder]="'Cost Center'" [clearable]="true" [searchable]="true"
                  formControlName="selectedCostCenter" [(ngModel)]="selectedCostCenter" (change)="onLocationChange($event)">
                  <ng-option *ngFor="let item of costCenterList" [value]="item">{{ item.Kostl }}</ng-option>
                </ng-select>
              </div>
            </div>
          </div>
          <div class="col-2" *ngIf="isConsumableAction != '1'">
            <div class="d-flex justify-content-end">
             <button type="button" class="header-btn" (click)="resetForm()" >
                  <span>Cancel</span>
                </button>
                <button type="submit" class="header-btn" (click)="createReservationSet()">
                  <span>Post</span>
                </button>
            </div>
          </div>

          <div lass="col-9" *ngIf="isConsumableAction == '1'">
            <div class="progress-header">
              <form [formGroup]="historyFilterForm"> 
                <div class="d-flex align-items-center justify-content-between">
                  <div class="input-group">
                    <input
                    class="form-control"
                    type="text"
                    placeholder="From Date"
                    [minDate]=""
                    [maxDate]=""
                    #dp="bsDatepicker"
                    bsDatepicker
                    formControlName="FromDate"
                    [bsConfig]="{
                      showWeekNumbers: false,
                      dateInputFormat: 'DD.MM.YYYY'
                    }"
                    style="height: 33px;
                    width: 120px;
                    border-color: #ccc
                    "
                  />
                  <div class="input-group-append">
                    <span class="input-group-text" style="position: absolute; left: 90px; top: 2px; background: transparent; border: none;">
                      <i class="fa fa-calendar" style="color: #007bff;"></i>
                    </span>
                  </div>
                    </div>
                    <div class="input-group">
                      <input
                      class="form-control"
                      type="text"
                      placeholder="To Date"
                      [minDate]=""
                      [maxDate]=""
                      #dp="bsDatepicker"
                      bsDatepicker
                      formControlName="ToDate"
                      [bsConfig]="{
                        showWeekNumbers: false,
                        dateInputFormat: 'DD.MM.YYYY'
                      }"
                      style="height: 33px;
                      width: 120px;
                      border-color: #ccc;
                      margin-left: 15px"
                    />
                    <div class="input-group-append">
                      <span class="input-group-text" style="position: absolute; left: 106px; top: 2px; background: transparent; border: none;">
                        <i class="fa fa-calendar" style="color: #007bff;"></i>
                      </span>
                    </div>
                      </div>
                  <div class="storage-box w-100">
                    <ng-select class="ng-select-dropdown" formControlName="moveType" [placeholder]="'Movement type'" (change)="selectType($event)">
                      <ng-option *ngFor="let type of movementTypes" [value]="type.value">{{ type.label }}</ng-option>
                    </ng-select>
                  </div>

                  <div class="storage-box w-100">
                    <ng-select [searchable]="true"   formControlName="userName" placeholder="User name">
                      <ng-option>test</ng-option>
                    </ng-select>
                  </div>

                  <div class="storage-box w-100">
                    <ng-select class="ng-select-dropdown" [placeholder]="'Storage Location'" [clearable]="true" [searchable]="true"
                    formControlName="stoLocation">
                      <ng-option *ngFor="let item of storageLocationList" [value]="item">{{ item.Lgort }}</ng-option>
                    </ng-select>
                  </div>

                  <div class="storage-box w-100">
                    <ng-select  [placeholder]="'Cost Center'" [clearable]="true" [searchable]="true"
                    formControlName="cosCenter">
                      <ng-option *ngFor="let item of costCenterList" [value]="item">{{ item.Kostl }}</ng-option>
                    </ng-select>
                  </div>

                  <div class="storage-box w-100">
                    <ng-select class="ng-select-dropdown"[clearable]="true"  formControlName="meCode" [searchable]="true"  (search)="searchMaterial($event.term, wordType.MaterialCode$)" [placeholder]="'Material'">
                  <ng-option *ngFor="let item of materialList" [title]="item.Matnr+' '+item.Maktx" [value]="item">{{item.Matnr}} -
                    {{item.Maktx}}</ng-option>
                  </ng-select>
                   
                  </div>
                  <div>
                    <button type="button" class="header-btn apply-button" (click)="applyFilter()">
                      <span>Apply</span>
                    </button>
                  </div>
                 </div>
              </form>
            </div>
          </div>
        </div>
      </form>
  </div>
  <ng-container>
    <app-history-list *ngIf="isConsumableAction == '1'"></app-history-list>
    <app-reservation-list [selectedType]="selectedType"  (reservationSaved)="onReservationSaved()" [storageLocationList]="storageLocationList" *ngIf="isConsumableAction == '2'"></app-reservation-list>
  </ng-container>
