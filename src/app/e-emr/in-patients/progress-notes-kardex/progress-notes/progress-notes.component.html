<div class="container-fluid h-100" style="border: 5px solid #0082c8;
padding: 10px;">
  <div class="progress-header">
    <div [formGroup]="progressNoteForm" class="">
      <div class="d-flex justify-content-between">
        <div class="header-date">
          <img src="assets/img/date-icon.svg" alt="" style="position: absolute;
          left: 44px;"/>
          <input
            formControlName="ActionDate"
            class="form-control"
            style="font-weight: 800; color: #000; border-radius: 8px"
            type="text"
            placeholder=""
            [minDate]=""
            [maxDate]=""
            #dp="bsDatepicker"
            bsDatepicker
            [bsConfig]="{
              showWeekNumbers: false,
              dateInputFormat: 'DD.MM.YYYY'
            }"
          />
        </div>
        <div class="header-time">
          <span
            _ngcontent-ufq-c103=""
            style="
              position: absolute;
              margin-top: 8px;
              font-size: 18px;
              padding-left: 8px;
            "
            ><i
              _ngcontent-ufq-c103=""
              aria-hidden="true"
              class="fa fa-clock-o"
            ></i
          ></span>
          <input
            type="text"
            class="form-control"
            aria-label="24hr format"
            [ngxTimepicker]="fullTime"
            [format]="24"
            formControlName="ActionTime"
            style="
              height: 38px;
              font-size: 14px;
              width: 100px;
              padding-left: 34px;
              color: #000;
              font-weight: 800;
              border-radius: 8px;
            "
          />
          <ngx-material-timepicker
            #fullTime
            style="z-index: 9999 !important; position: relative !important"
          ></ngx-material-timepicker>
        </div>
        <div class="header-occupational">
          <ng-select
            [searchable]="true"
            (ngModelChange)="onDateChange()"
            formControlName="ProfGroup"
            placeholder="Occupational Group"
          >
            <ng-option
              *ngFor="let data of occupationalGroupData"
              [value]="data.Group"
              >{{ data.Text }}</ng-option
            >
          </ng-select>
        </div>
        <div class="header-category">
          <ng-select
            [searchable]="true"
            (ngModelChange)="onDateChange()"
            formControlName="Category"
            placeholder="Category"
          >
            <ng-option
              *ngFor="let category of categoryList"
              [value]="category.CatId"
              >{{ category.CatText }}</ng-option
            >
          </ng-select>
        </div>
        <div class="header-template">
          <ng-select
            (change)="onTempleteSelect()"
            [ngModelOptions]="{standalone: true}"
            [(ngModel)]="templteContent"
            placeholder="Template"
          >
            <ng-option *ngFor="let data of templateList" [value]="data">{{
              data.Keyword
            }}</ng-option>
          </ng-select>
        </div>
        <div class="header-btn" (click)="cancelProgressNote()">
          <button
            type="button"
            class="create-progress"
          >
            Cancel
          </button>
        </div>
        <div class="header-btn">
          <button
            (click)="createProgressNote()"
            type="button"
            class="create-progress"
          >
            Create
          </button>
        </div>
      </div>
      <div class="progress mt-3">
        <textarea formControlName="Text" class="form-control"></textarea>
      </div>
    </div>
  </div>

  <div class="progress-notes-list">
    <app-progress-note-list (copyProgressNotes)="copyProgressNotesEvent($event)"
      (reloadPhyOrderList)="reloadPhyOrderListEvent($event)"
      [ProgressNotesList]="ProgressNotesList | filter : searchString"
    ></app-progress-note-list>
  </div>
</div>
