<div class="surgery-list mt-3">
    <Form class="diagnosis-form mt-1" [formGroup]="admissionOrderForm">
        <ng-container formArrayName="admissionOrderFormArray" *ngFor=" let item of admissionOrderForm.get('admissionOrderFormArray')['controls']; let i = index" >
          <div *ngIf="!item.value.CancelInd" class="diagnosis-list mt-1 surgery-list borderbottom pr-2 pl-2 pt-2 pb-2 cursor-pointer" (click)="selectOrderIndex(i, item)" [ngClass]="selectedOrderIndex == i ? 'select-order-tab' : ''">
            <div [formGroupName]="i" >
              <div class="d-flex justify-content-between" (click)="$event.stopPropagation()">
                <div class="d-flex align-items-center position-relative w-20 mr-1">
                  <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                    <span class="input-title z-indexlabel">Treatment OU</span>
                    <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                      <ng-select class="d-grid-am" (change)="onSelectTreatmentOU($event, i)" formControlName="Trtoe" [markFirst]="false"
                        [typeahead]="searchTermTreatmentOU" [title]="setInputTitle(item.get('Trtoe').value)" appendTo="body">
                        <ng-option *ngFor="let service of treatmentOUList" [value]="service">  {{ service.Orgna }} </ng-option>
                      </ng-select>
                    </span>
                  </span>
                </div>
                <div class="d-flex align-items-center position-relative w-20 mr-1">
                    <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                      <span class="input-title z-indexlabel">Treatment Department</span>
                      <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                        <input formControlName="TrtoeText" type="text" class="form-control" [readOnly]="true" [title]="setInputTitle(item.get('TrtoeText').value)"/>
                      </span>
                    </span>
                </div>

                <div class="d-flex align-items-center position-relative w-20 mr-1">
                    <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                      <span class="input-title z-indexlabel">Physician</span>
                      <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                        <ng-select class="d-grid-am" (change)="onSelectSurgeon($event, i)" formControlName="Trtgp" [markFirst]="false"
                          [title]="setInputTitle(item.get('Trtgp').value)" [searchable]="true" appendTo="body">
                        <ng-option *ngFor="let service of assignUsersList" [value]="service">  {{ service.NamString }} </ng-option>
                      </ng-select>
                      </span>
                    </span>
                  </div>
                  <div class="d-flex align-items-center position-relative w-20 mr-1">
                      <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                        <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                          <input formControlName="TrtgpName" type="text" class="form-control" [readOnly]="true" [title]="setInputTitle(item.get('TrtgpName').value)"/>
                        </span>
                      </span>
                    </div>
                <!-- <div class="d-flex align-items-center position-relative w-30 mr-1"></div> -->
                <div class="d-flex align-items-center position-relative w-20 mr-1">
                    <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                      <span class="input-title z-indexlabel">Valid On</span>
                      <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                        <input formControlName="ValidOn" type="text" class="form-control" numbersOnly [title]="setInputTitle(item.get('ValidOn').value)"/>
                      </span>
                    </span>
                </div>
              </div>
              <div class="d-flex"  (click)="$event.stopPropagation()">
                <div class="d-flex align-items-center position-relative w-20 mr-1">
                    <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                      <span class="input-title z-indexlabel">Department OU</span>
                      <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                        <ng-select class="d-grid-am" (change)="onSelectDepartmentOU($event, i)" formControlName="Orgfa" [markFirst]="false"
                            [typeahead]="searchTermDepartmentOU" [title]="setInputTitle(item.get('Orgfa').value)" appendTo="body">
                        <ng-option *ngFor="let service of departmentOUList" [value]="service">  {{ service.Orgna }} </ng-option>
                      </ng-select>
                      </span>
                    </span>
                </div>
                <div class="d-flex align-items-center position-relative w-20 mr-1">
                    <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                      <span class="input-title z-indexlabel">Department Name</span>
                      <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                        <input formControlName="OrgfaText" type="text" class="form-control" [readOnly]="true" [title]="setInputTitle(item.get('OrgfaText').value)"/>
                      </span>
                    </span>
                </div>
          
                <div class="d-flex align-items-center position-relative w-40 mr-1">
                    <span class="d-flex align-items-center p-0 w-100 position-relative pt-2">
                      <span class="input-title z-indexlabel">Order Type</span>
                      <span class="input-text-field d-inline-block align-top w-100 font-weight-bolder">
                        <input type="text" class="form-control" value="Admission" [readOnly]="true"/>
                      </span>
                    </span>
                </div>
                <div class="w-20 ml-2 mt-2">
                    <div class="d-flex align-items-center h-100">
                      <input class="mr-1 largerCheckbox" type="checkbox" formControlName="Autoselect" />
                      <label class="m-0">Selected by Default.</label>
                    </div>
                  </div>
              </div>
            </div>
          </div>
        </ng-container>
      </Form>
      
          
      <ng-template #deleteModal id="deleteModal">
        <div class="modal-body p-0">
          <div class="update-template-title">
            <h4 class="m-0 pl-3">Delete admission</h4>
          </div>
          <div class="p-3">
            <div class="update-template-contant">
              <p>
                Are you sure you want to delete this admission?</p>
            </div>
            <div class="text-right mt-3">
              <button type="button" class="update-Exsiting mr-3" (click)="removeClinicalTabAPi()">
                Continue
              </button>
              <button type="button" class="update-Exsiting" (click)="modalRef.hide()">Cancel</button>
            </div>
          </div>
        </div>
      </ng-template>
      
</div>
