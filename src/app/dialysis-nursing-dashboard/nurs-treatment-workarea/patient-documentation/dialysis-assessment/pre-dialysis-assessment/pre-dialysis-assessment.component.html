<div class="predialysis-assessment-main bg-white mt-4">
  <form [formGroup]="predialysis">
    <div class="perdialysis-info">
      <div class="container-fluid">
        <div class="pre-dialysis-info position-relative p-3 mb-4">
          <label for="" class="title-text m-0"></label>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Treatment Date</label>
                <input type="text" class="w-100" formControlName="TreatmentDate" bsDatepicker
                  [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false }">
              </div>
            </div>
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Dialysis First Date</label>
                <input type="text" class="w-100" formControlName="DialysisFDate" bsDatepicker
                  [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false }">
              </div>
            </div>
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Blood Test Done</label>
                <ng-select class="w-100" formControlName="BloodTest">
                  <ng-option value="0">Weekly</ng-option>
                  <ng-option value="1">Monthly</ng-option>
                  <ng-option value="2">Random</ng-option>
                </ng-select>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-8">
                <label for="" class="text-nowrap m-0">Prescribed Time</label>
                <!-- <input type="text" class="form-control" step="2" formControlName="PrescribedTime" [bsConfig]="{withTimepicker:
                true,showWeekNumbers:false,
                dateInputFormat: 'HH:mm:ss', selectFromOtherMonth: true}" bsDatepicker [isDisabled]="true" />
                <label for="" class="unites-labels text-nowrap m-0">hr</label> -->
                <!-- <timepicker [showSeconds]=true formControlName="PrescribedTime"></timepicker> -->
                <input  type="time"
                class="form-control w-100"
                step="2"
                min="08:00:00" max="17:00:00"
                placeholder="HH:mm:ss"
                style="width:31%;margin: 0px 0px 0px -23px;" formControlName="PrescribedTime">
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Dry Weight</label>
                <input type="text" class="w-100" formControlName="DryWeight">
                <label for="" class="unites-labels text-nowrap m-0">kg</label>
              </div>
            </div>
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Mechine #</label>
                <input type="text" class="w-100" formControlName="Machine">
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Blood Flow Rate</label>
                <input type="text" class="w-100" formControlName="BloodFlow">
                <label for="" class="unites-ml text-nowrap m-0" style="min-width: unset;right: 5px;">ml/min</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Previous Post Weight</label>
                <input type="text" class="w-100" formControlName="PostWeight">
                <label for="" class="unites-labels text-nowrap m-0">kg</label>
              </div>
            </div>
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Treatment #</label>
                <input type="text" class="w-100" formControlName="Treatment">
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Type of Dialyzer</label>
                <ng-select class="w-100" formControlName="TypeDialyzer">
                  <ng-option value="0">High Flux</ng-option>
                  <ng-option value="1">Low Flux</ng-option>
                </ng-select>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">New Dry Weight</label>
                <input type="text" class="w-100" formControlName="NewDryWeight">
                <label for="" class="unites-labels text-nowrap m-0">kg</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Height</label>
                <input type="text" class="w-100" formControlName="Height">
                <label for="" class="unites-labels text-nowrap m-0">cm</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0">Desired Weight Loss</label>
                <input type="text" class="w-100" formControlName="WeightLoss">
                <label for="" class="unites-labels text-nowrap m-0">kg</label>
              </div>
            </div>
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input gap-8">
                <label for="" class="text-nowrap m-0">Treatment Time</label>
                <!-- <input type="time" bsDatepicker
                [bsConfig]="{showWeekNumbers: false,withTimepicker:true, dateInputFormat:'HH:mm:ss'}" class="w-100" formControlName="TreatmentTime"> -->
                <!-- <input type="text" class="form-control" step="2" formControlName="TreatmentTime" [bsConfig]="{withTimepicker:
                true,showWeekNumbers:false,
                dateInputFormat: 'HH:mm:ss', selectFromOtherMonth: true}" bsDatepicker [isDisabled]="true" /> -->
                <!-- <timepicker [showSeconds]=true formControlName="TreatmentTime"></timepicker> -->
                <input  type="time"
                class="form-control w-100"
                step="2"
                min="08:00:00" max="17:00:00"
                placeholder="HH:mm:ss"
                style="width:31%;margin: 0px 0px 0px -23px;" formControlName="TreatmentTime">
              </div>
            </div>
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input gap-8">
                <label for="" class="text-nowrap m-0">Dialysis First Time</label>
                <!-- <input type="text" class="form-control" step="2" formControlName="DialysisFTime" [bsConfig]="{withTimepicker:
                true,showWeekNumbers:false,
                dateInputFormat: 'HH:mm:ss', selectFromOtherMonth: true}" bsDatepicker [isDisabled]="true" /> -->
                <!-- <timepicker [showSeconds]=true formControlName="DialysisFTime"></timepicker> -->
                <input  type="time"
                class="form-control w-100"
                step="2"
                min="08:00:00" max="17:00:00"
                placeholder="HH:mm:ss"
                style="width:31%;margin: 0px 0px 0px -23px;" formControlName="DialysisFTime">
              </div>
            </div>
          </div>

        </div>
        <div class="pre-dialysis-info-second position-relative p-3 mb-4">
          <label for="" class="title-text m-0">PRE DIALYSIS CHECKS</label>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Pre Weight</label>
                <input type="text" class="w-100" formControlName="PreWeight">
                <label for="" class="unites-labels text-nowrap m-0">kg</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input  gap-22">
                <label for="" class="text-nowrap m-0">Oxygen Saturation</label>
                <input type="text" class="w-100" formControlName="OxygenSaturation">
                <label for="" class="unites-labels text-nowrap m-0">%</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Oxygen Flow</label>
                <input type="text" class="w-100" formControlName="OxygenFlow">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 5px;">L/min</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Oxygen Delivery</label>
                <ng-select class="w-100" formControlName="OxygenDelivery">
                  <ng-option value="0">Nasal Cannula</ng-option>
                  <ng-option value="1">Oxygen Face Mask</ng-option>
                  <ng-option value="2">Face Mask with O<sub>2</sub></ng-option>
                  <ng-option value="3">Venturi Mask</ng-option>
                </ng-select>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Oral Temp</label>
                <input type="text" class="w-100" formControlName="OralTemp">
                <label for="" class="unites-labels text-nowrap m-0">*C</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Axillary Temp</label>
                <input type="text" class="w-100" formControlName="AxillaryTemp">
                <label for="" class="unites-labels text-nowrap m-0">*C</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Pulse Rate</label>
                <input type="text" class="w-100" formControlName="PulseRate">
                <label for="" class="unites-labels text-nowrap m-0">bpm</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0">Respiratoty Rate</label>
                <input type="text" class="w-100" formControlName="RespiratoryRate">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 5px;">br/min</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0" style="min-width: 220px;">Systolic Blood Pressre Sitting</label>
                <input type="text" class="w-100" formControlName="SystolicBloodSitting">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 5px;">br/min</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0" style="min-width: 220px;">Diastolic Blood Pressre Sitting</label>
                <input type="text" class="w-100" formControlName="DiastolicBloodSitting">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 8px;">br/min</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input gap-22">
                <label for="" class="text-nowrap m-0" style="right: 5px;">Mean Arterial Pressure</label>
                <input type="text" class="w-100" formControlName="ArterialPressure">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 5px;">br/min</label>
              </div>
            </div>
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0" style="min-width: 220px;">Systolic Bllod Pressure Standing</label>
                <input type="text" class="w-100" formControlName="SystolicBloodStanding">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 5px;">br/min</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label for="" class="text-nowrap m-0" style="min-width: 220px;">Diastolic Bllod Pressure
                  Standing</label>
                <input type="text" class="w-100" formControlName="DiastolicBloodStanding">
                <label for="" class="unites-labels text-nowrap m-0" style="right: 8px;">br/min</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
