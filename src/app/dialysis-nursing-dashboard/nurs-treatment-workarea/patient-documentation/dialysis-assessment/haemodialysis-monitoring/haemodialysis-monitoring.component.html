<div class="monitoring-main">
  <form [formGroup]="haemodialysisArr">
    <div class="monitoring-wrapper">
      <table class="w-100 mt-4">
        <thead>
          <tr>
            <th>
              <div class="d-flex align-items-center justify-content-center">
                <img src="assets/img/Add.svg" alt width="20" height="20" (click)="addRow()">
              </div>
            </th>
            <th>Time</th>
            <th>BFR</th>
            <th>AP</th>
            <th>VP</th>
            <th>UFR</th>
            <th>TFR</th>
            <th>DFR</th>
            <th>Systolic B...</th>
            <th>Diastolic...</th>
            <th>Pulse Rate</th>
            <th>Replace...</th>
            <th>Fluid Type</th>
            <th>Medications...</th>
            <th style="width: 15%;">Comments</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody formArrayName="TOMONITOR">
          <tr *ngFor="let data of patientDocService.ToMonitor.controls; let i =  index" [formGroupName]="i">
            <td>
              <div class="d-flex align-items-center justify-content-center">
                <input type="checkbox" name="" (change)="tableCheckChange($event,i)">
              </div>
            </td>
            <td>
              <input type="text" bsDatepicker
              [bsConfig]="{ dateInputFormat: 'hh:mm:ss', showWeekNumbers: false }" class="border-0 px-3 py-2" name="Timee" style="width: 140px;" formControlName="Timee">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 80px;" formControlName="Bfr">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 80px;" formControlName="Ap">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 80px;" formControlName="Vp">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 80px;" formControlName="Ufr">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 80px;" formControlName="Tfr">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 80px; background: transparent;" formControlName="Dfr">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 120px;" formControlName="Systolic">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 110px;" formControlName="Diastolic">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 110px;" formControlName="PulseRate">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 110px;" formControlName="Replacement">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 110px;" formControlName="FluidType">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 130px;" formControlName="Medications">
            </td>
            <td>
              <input type="text" class="border-0 px-3" style="width: 210px;" formControlName="Comments">
            </td>
            <td>
              <div class="d-flex align-items-center justify-content-center">
                <img src="assets/img/delete-icon.svg" alt width="20px" height="20" (click)="deleteRow(i)">
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="selectors mt-4" [formGroup]="haemodialysisMonitoring">
      <div class="container-fluid p-0">
        <label class="tag-line" title="Select Yes on the type of Dialiysis done will add the charges">Select Yes on the type of Dialiysis done will add the charges</label>
        <div class="row mt-3">
          <div class="col-4">
            <div class="common-selector position-relative">
              <div class="d-flex align-items-center ">
                <label for="" class="label-heading mr-3">Haemodialysis Chorosic Done?</label>
                <div class="d-flex align-items-center mr-3">
                  <input type="radio" value="1" formControlName="ChronicDone">
                  <label class="mx-2" for="yesOption">Yes</label>
                </div>
                <div class="d-flex align-items-center mr-3">
                  <input type="radio" value="0" formControlName="ChronicDone">
                  <label class="mx-2" for="noOption">No</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="common-selector position-relative">
              <div class="d-flex align-items-center">
                <label for="" class="label-heading mr-3">Haemodialysis Acute Done?</label>
                <div class="d-flex align-items-center  mr-3">
                  <input type="radio" value="1" formControlName="AcuteDone">
                  <label class="mx-2" for="yesOption">Yes</label>
                </div>
                <div class="d-flex align-items-center  mr-3">
                  <input type="radio" value="0" formControlName="AcuteDone">
                  <label class="mx-2" for="noOption">No</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="common-selector position-relative">
              <div class="d-flex align-items-center mr-2">
                <label for="" class="label-heading mr-3">Haemodialysis International Done?</label>
                <div class="d-flex align-items-center  mr-3">
                  <input type="radio" value="1" formControlName="InternationalDone">
                  <label class="mx-2" for="yesOption">Yes</label>
                </div>
                <div class="d-flex align-items-center  mr-3">
                  <input type="radio" value="0" formControlName="InternationalDone">
                  <label class="mx-2" for="noOption">No</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
