<div class="dialysis-main">
  <div class="tabs w-100">
    <div class="d-flex align-items-center justify-content-center menu-wrapper position-relative" (click)="tabPanelNavigation('haemodialysis')"
      [ngClass]="this.Haemodialysis ? 'active'
    : ''">
      <input type="radio" id="tab1" name="tab" checked>
      <img src="assets/img/grid-icon.svg" alt width="17px" height="auto">
      <label for="tab1" class="ml-3 m-0"> Haemodialysis Access</label>
    </div>
    <div class="d-flex align-items-center justify-content-center menu-wrapper position-relative" (click)="tabPanelNavigation('preDialysis')" [ngClass]="this.PreDialysis ? 'active'
    : ''">
      <img src="assets/img/grid-icon.svg" alt width="17px" height="auto">
      <input type="radio" id="tab2" name="tab">
      <label for="tab2" class="ml-3 m-0">Pre-Dialysis Assessment</label>
    </div>
    <div class="d-flex align-items-center justify-content-center menu-wrapper position-relative" (click)="tabPanelNavigation('haemodialysis-line-infection-surveillance')" [ngClass]="this.HaemodialysisLineInfectionSurveillance ? 'active': ''">
      <img src="assets/img/grid-icon.svg" alt width="17px" height="auto">
      <input type="radio" id="tab3" name="tab">
      <label for="tab3" class="ml-3 m-0">Haemodialysis Line Infection Surveillance</label>
    </div>
    <div class="d-flex align-items-center justify-content-center menu-wrapper position-relative" (click)="tabPanelNavigation('haemodialysis-monitoring')" [ngClass]="this.HaemodialysisMonitoring ? 'active': ''">
      <img src="assets/img/grid-icon.svg" alt width="17px" height="auto">
      <input type="radio" name="tab">
      <label class="ml-3 m-0"> Haemodialysis Monitoring </label>
    </div>
    <div class="d-flex align-items-center justify-content-center menu-wrapper position-relative" (click)="tabPanelNavigation('postdialysisevaluation')" [ngClass]="this.PostDialysisEvaluation ? 'active': ''">
      <img src="assets/img/grid-icon.svg" alt width="17px" height="auto">
      <input type="radio" name="tab">
      <label  class="ml-3 m-0"> Post Dialysis Evaluation </label>
    </div>
    <div class="d-flex align-items-center justify-content-center menu-wrapper position-relative" (click)="tabPanelNavigation('peritoneal')" [ngClass]="this.Peritoneal ? 'active': ''">
      <img src="assets/img/grid-icon.svg" alt width="17px" height="auto">
      <input type="radio"  name="tab">
      <label class="ml-3 m-0"> Peritoneal Dialysis Home Visit Checklist </label>
    </div>
  </div>
  <ng-container *ngIf="this.PreDialysis">
    <pre-dialysis-assessment></pre-dialysis-assessment>
  </ng-container>

  <ng-container *ngIf="this.Haemodialysis">
    <haemodialysis-access></haemodialysis-access>
  </ng-container>

  <ng-container *ngIf="this.HaemodialysisLineInfectionSurveillance">
    <haemodialysis-line-infection-surveillance></haemodialysis-line-infection-surveillance>
  </ng-container>

  <ng-container *ngIf="this.HaemodialysisMonitoring">
    <haemodialysis-monitoring></haemodialysis-monitoring>
  </ng-container>

  <ng-container *ngIf="this.PostDialysisEvaluation">
    <post-dialysis-evaluation></post-dialysis-evaluation>
  </ng-container>

  <ng-container *ngIf="this.Peritoneal">
    <peritoneal></peritoneal>
  </ng-container>
</div>
