<div class="dialysis-assessment-main bg-white mt-4">
  <form [formGroup]="haemodial">
  <div class="dialysis-info">
    <div class="container-fluid">
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">Braden Question</h4>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaSMonday">
            <label for="" class="m-0">Monday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="HaSTuesday">
            <label for="" class="m-0">Tuesday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaSWednesday">
            <label for="" class="m-0">Wednesday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaSThursday">
            <label for="" class="m-0">Thusday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaSFriday">
            <label for="" class="m-0">Friday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaSSaturday">
            <label for="" class="m-0">Saturday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaSSunday">
            <label for="" class="m-0">Sunday</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <div class="d-flex align-items-center">
              <input type="checkbox" class="mr-3" name="HaSOther" formControlName="HaSOther" (change)="patientDocService.checkChange($event)">
              <label for="" class="m-0" >Other</label>
            </div>
            <div class="ml-4 w-100">
              <input type="text" class="w-100" formControlName="HaSOtherTxt" [readonly]="!this.patientDocService.isHaSOtherChecked">
            </div>
          </div>
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">Blood draw Precaution</h4>
        <div class="col-3">
          <div class="d-flex align-items-center">
            <ng-select class="w-100" formControlName="BloodDraw" (change)="onSelectionChange($event)">
              <ng-option value="1">Yes</ng-option>
              <ng-option value="0">No</ng-option>
            </ng-select>
          </div>
        </div>
        <div class="col-3">
          <div class="d-flex align-items-center">
            <label for="" class="mr-3 mb-0">Specify</label>
            <input type="text" class="w-100" formControlName="BloodDrawTxt" [readonly]="!isEnableSelection">
          </div>
        </div>
        <div class="col-3">
        </div>
        <div class="col-3">
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">Haemodialysis Access</h4>
        <div class="col-3">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaAFistula">
            <label for="" class="m-0">AV Fistula</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaAGraft">
            <label for="" class="m-0">AV Graft</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaACatheter">
            <label for="" class="m-0">Catheter</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
            <label for="" class="m-0">Trans Lumbar</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="HaAPd">
            <label for="" class="m-0">PD</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <div class="d-flex align-items-center">
              <input type="checkbox" class="mr-3" name="HaAOther" formControlName="HaAOther" (change)="patientDocService.checkChange($event)">
              <label for="" class="m-0">Other</label>
            </div>
            <div class="ml-4 w-100">
              <input type="text" class="w-100" formControlName="HaAOtherTxt"  [readonly]="!this.patientDocService.isHaAOtherChecked">
            </div>
          </div>
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4>Fistula Location</h4>
        <div class="col-3">
          <ng-select class="w-100" formControlName="FistulaLocation">
            <ng-option>Right Forearm</ng-option>
            <ng-option>Right Upper arm</ng-option>
            <ng-option>Left Forearm</ng-option>
            <ng-option>Left Upper arm</ng-option>
          </ng-select>
        </div>
        <div class="col">
        </div>
        <div class="col">
        </div>
        <div class="col">
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">AV Graft Loaction</h4>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvRightForearm">
            <label for="" class="m-0">Right Forearm</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvRightUpperarm">
            <label for="" class="m-0">Right Upaper arm</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvRightAnterior">
            <label for="" class="m-0">Right Anterior chest</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvRightThigh">
            <label for="" class="m-0">Right Thigh</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvRightLower">
            <label for="" class="m-0">Right Lower leg</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvLeftForearm">
            <label for="" class="m-0">Left Forearm</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvLeftUpperarm">
            <label for="" class="m-0">Left Upper arm</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvLeftAnterior">
            <label for="" class="m-0">Left Anterior chest</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvLeftThigh">
            <label for="" class="m-0">Left Thigh</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="AvLeftLower">
            <label for="" class="m-0">Left Lower leg</label>
          </div>
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">Dialysis Catheter Location</h4>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiSubclavianLeft">
            <label for="" class="m-0">Subclavian Left</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiSubclavianRight">
            <label for="" class="m-0">Subclavian Right</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiInternalLeft">
            <label for="" class="m-0">Intrenal Jugular Left</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiInternalRight">
            <label for="" class="m-0">Intrenal Jugular Right</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiFemoralLeft">
            <label for="" class="m-0">Femoral Left</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiFemoralRight">
            <label for="" class="m-0">Femoral Right</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="DiTransLumbar">
            <label for="" class="m-0">Trans Lumbar</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <div class="d-flex align-items-center">
              <input type="checkbox" class="mr-3" name="DiOther" formControlName="DiOther" (change)="patientDocService.checkChange($event)">
              <label for="" class="m-0">Other</label>
            </div>
            <div class="ml-4 w-100">
              <input type="text" class="w-100" formControlName="DiOtherTxt" [readonly]="!this.patientDocService.isDiOtherChecked">
            </div>
          </div>
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">Fistula Status/Condition</h4>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3"formControlName="FiBruising" >
            <label for="" class="m-0">Brusing Abrasions</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiClotted">
            <label for="" class="m-0">Clotted</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiAudible">
            <label for="" class="m-0">Audible bruit</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiPalpable">
            <label for="" class="m-0">Palpable thrill</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiInflammed">
            <label for="" class="m-0">Inflammed</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiPatent">
            <label for="" class="m-0">Patent</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiNoAudible">
            <label for="" class="m-0">No Audible bruit</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="FiNoPalpable">
            <label for="" class="m-0">No Palpable thrill</label>
          </div>
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4 class="m-0">AV Graft Status/Condition</h4>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvAudibleBruit">
            <label for="" class="m-0">Audible bruit</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvPalpableThrill">
            <label for="" class="m-0">Plapable thrill</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvPulsePresent">
            <label for="" class="m-0">Pulse Present</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvPatent">
            <label for="" class="m-0">Patent</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvNoAudible">
            <label for="" class="m-0">No Audible bruit</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvNoPalpable">
            <label for="" class="m-0">No Plapable thrill</label>
          </div>
        </div>
        <div class="col-3 my-2">
          <div class="d-flex align-items-center">
            <input type="checkbox" class="mr-3" formControlName="AvPulseAbsent">
            <label for="" class="m-0">Pulse Absent</label>
          </div>
        </div>
      </div>
      <div class="row align-items-center my-4 custom-title">
        <h4>Dressing Changed</h4>
        <div class="col-3 my-lg-2">
          <div class="d-flex align-items-center w-100">
            <ng-select class="w-100" formControlName="DressingChanged">
              <ng-option value="1">Yes</ng-option>
              <ng-option value="0">No</ng-option>
            </ng-select>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
</div>
