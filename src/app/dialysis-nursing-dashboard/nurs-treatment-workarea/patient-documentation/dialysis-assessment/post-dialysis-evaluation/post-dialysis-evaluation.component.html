<div class="evaluation-main bg-white mt-4">
  <form [formGroup]="postdialevalution">
    <div class="evaluation-info">
      <div class="container-fluid p-0">
        <div class="evaluation-info position-relative p-3">
          <label class="title-text m-0"></label>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Treatment Date</label>
                <input type="text" class="w-50" formControlName="PTreatmentDate" #dp="bsDatepicker" bsDatepicker
                  [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false }">
              </div>
            </div>
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Treatment Time</label>
                <input type="time" step="1" class="w-50" formControlName="PTreatmentTime">
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Post Weight</label>
                <input type="number" class="w-50" formControlName="PPostWeight">
                <label class="unites-labels text-nowrap m-0" style="right: 40px;">kg</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Axlilary Temp (&#8451;)</label>
                <input type="number" class="w-50" formControlName="PAxillaryTemp">
                <label class="unites-labels text-nowrap m-0" style="right: 40px;">&#8451;</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Oral Temp (&#8451;)</label>
                <input type="number" class="w-50" formControlName="POralTemp">
                <label class="unites-labels text-nowrap m-0" style="right: 40px;">&#8451;</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Pulse Rate</label>
                <input type="number" class="w-50" formControlName="PPulseRate">
                <label class="unites-labels text-nowrap m-0" style="right: 25px;">bpm</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Respiratory Rate</label>
                <input type="number" class="w-50" formControlName="PRespiratoryRate">
                <label class="unites-ml text-nowrap m-0" style="right: 15px;">br/min</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Oxygen Saturation</label>
                <input type="number" class="w-50" formControlName="POxygenSaturation">
                <label class="unites-labels text-nowrap m-0" style="right: 40px;">%</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Oxygen Flow</label>
                <input type="number" class="w-50" formControlName="POxygenFlow">
                <label class="unites-labels text-nowrap m-0" style="right: 20px;">L/min</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Oxygen Delivery</label>
                <ng-select class="w-50" formControlName="POxygenDelivery">
                  <ng-option value="Nasal Cannula">Nasal Cannula</ng-option>
                  <ng-option value="Oxygen Face Mask">Oxygen Face Mask</ng-option>
                  <ng-option value="Face Mask with 02">Face Mask with 02</ng-option>
                  <ng-option value="Venturi Mask">Venturi Mask</ng-option>
                </ng-select>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Systolic Blood Pressure Sitting</label>
                <ng-select class="w-50" formControlName="PSystolicBloodSitting">
                  <ng-option value="High Flux">High Flux</ng-option>
                  <ng-option value="Low Flux">Low Flux</ng-option>
                </ng-select>
                <label class="unites-labels text-nowrap m-0" style="right: 15px;">mmHg</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Diastolic Blood Pressure Sitting</label>
                <input type="number" class="w-50" formControlName="PDiastolicBloodSitting">
                <label class="unites-labels text-nowrap m-0" style="right: 15px;">mmHg</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Mean Arterial Pressure</label>
                <input type="number" class="w-50" formControlName="PArterialPressure">
                <label class="unites-labels text-nowrap m-0" style="right: 15px;">mmHg</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Systolic Boold Pressure Standing</label>
                <input type="number" class="w-50" formControlName="PSystolicBloodStanding">
                <label class="unites-labels text-nowrap m-0" style="right: 15px;">mmHg</label>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Diastolic Boold Pressure Standing</label>
                <input type="number" class="w-50" formControlName="PDiastolicBloodStanding">
                <label class="unites-labels text-nowrap m-0" style="right: 15px;">mmHg</label>
              </div>
            </div>
          </div>
        </div>
        <div class="evaluation-info position-relative mt-4 p-3">
          <label class="title-text m-0">Treatment Care plan</label>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">KT /V</label>
                <input type="number" class="w-50" formControlName="PKt">
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">BVP (L)</label>
                <input type="number" class="w-50" formControlName="PBvp">
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Dialyse Clearance</label>
                <ng-select class="w-50" formControlName="PDialyserClearance">
                  <ng-option value="Good">Good</ng-option>
                  <ng-option value="Poor">Poor</ng-option>
                  <ng-option value="Clotted">Clotted</ng-option>
                </ng-select>
              </div>
            </div>
          </div>
          <div class="row align-items-center my-3">
            <div class="col-4 pl-5 pr-5 position-relative">
              <div class="d-flex align-items-center w-100 custom-input">
                <label class="text-nowrap m-0">Hypotenstion</label>
                <ng-select class="w-50" formControlName="PHypotension">
                  <ng-option value="1">Yes</ng-option>
                  <ng-option value="0">No</ng-option>
                </ng-select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
