<div class="hemo-dialysis-fistula-graft-main bg-white mt-4">
    <form [formGroup]="hemoDialysisFistulGraftForm">
        <div class="hemo-dialysis-fistula-graft-info">
            <div class="container-fluid">
                <div class="custom-title">
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 100px;">Patient
                                    Name</label>
                                <input type="text" class="w-100" disabled [value]="patientData.name">
                            </div>
                        </div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">MRN</label>
                                <input type="number" class="w-100" disabled [value]="patientData.id">
                            </div>
                        </div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">DOB</label>
                                <input type="text" class="w-100" disabled
                                    [value]="patientData.birthDate | date : 'dd.MM.YYY'">
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 100px;">Gender</label>
                                <input type="text" class="w-100" disabled [value]="patientData?.gender.split('-')[1]">
                            </div>
                        </div>
                        <div class="col">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">Location</label>
                                <input type="text" class="w-100" disabled [value]="patientData?.location?.room || '-'">
                            </div>
                        </div>
                        <div class="col">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">Case</label>
                                <input type="number" class="w-100" disabled [value]="patientData?.case">
                            </div>
                        </div>
                        <div class="col">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 140px;">Day Since
                                    Admission</label>
                                <input type="text" class="w-100" disabled [value]="daysDifference">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="custom-title my-4">
                    <div class="container-fluid p-0">
                        <div class="row align-items-center my-4">
                            <h4 class="m-0">Bundle Elements</h4>
                            <div class="col-4">
                                <div class="d-flex align-items-center">
                                    <label for="" class="mr-3 mb-0 text-nowrap">Session Date</label>
                                    <input type="text" class="w-100" formControlName="SessionDate" [bsConfig]="{showWeekNumbers:false,
                                        dateInputFormat:
                                        'DD.MM.YYYY'}" bsDatepicker>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="d-flex align-items-center">
                                    <label for="" class="mr-3 mb-0 text-nowrap">Sesstion Time</label>
                                    <input type="text" class="w-100" formControlName="SessionTime" [bsConfig]="{withTimepicker:true,showWeekNumbers:false,
                                        dateInputFormat:
                                        'HH:mm:ss'}" bsDatepicker>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="d-flex align-items-center">
                                    <label for="" class="mr-3 mb-0 text-nowrap">Anatomical site of graft</label>
                                    <!-- <input type="text" class="w-100" >  -->
                                    <ng-select class="w-100" formControlName="AnatomicalSite" id="inputGroupSelect01">
                                        <ng-option *ngFor="let options of anatomicalSiteOptions" [value]="options.value" [title]="options.value">{{options.name}}</ng-option>
                                    </ng-select>
                                </div>
                            </div>
                        </div>
                        <div class="container-fluid px-2">
                            <div class="row align-items-start my-3 custom-title pt-4">
                                <h4 class="m-0">AV Cannulation</h4>
                                <div class="row align-items-center w-100">
                                    <div class="col-5">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="AvCan"
                                                    (change)="radioChange($event)" name="AvCan" class="mr-3" value="2">
                                                <label class="m-0">Not Applicable</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="AvCan"
                                                    (change)="radioChange($event)" name="AvCan" value="1" class="mr-3">
                                                <label class="m-0">No</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" disabled
                                                    [checked]="this.hemoDialysisFistulGraftForm.get('AvCan').value === '0'"
                                                    name="AvCan" class="mr-3">
                                                <label class="m-0">Yes</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-start">
                                            <input type="text" formControlName="AvCanTxt"
                                                [readonly]="this.hemoDialysisFistulGraftForm.get('AvCan').value === '2' ? false : true"
                                                class="w-50">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 my-2">
                                    <div class="row">
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvCan').value == '2' ? true : false"
                                                    class="mr-3" name="CanHandHygiene" (change)="checkChange($event)">
                                                <label class="m-0">Perform hand hygiene</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvCan').value == '2' ? true : false"
                                                    class="mr-3" name="CanProperPpe" (change)="checkChange($event)">
                                                <label for="" class="m-0">Don proper PPE (mask with face shield or mask
                                                    with goggles, plus gown & gloves)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvCan').value == '2' ? true : false"
                                                    class="mr-3" name="CanCleanSite" (change)="checkChange($event)">
                                                <label for="" class="m-0">Clean site with 2% CHG wipes or soap and
                                                    water</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvCan').value == '2' ? true : false"
                                                    class="mr-3" name="CanApplySkin" (change)="checkChange($event)">
                                                <label for="" class="m-0">Apply skin antiseptic (Chlorhexidine 2% or 10%
                                                    Povidone lodine) & allow it to dry</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvCan').value == '2' ? true : false"
                                                    class="mr-3" name="CanContactSite" (change)="checkChange($event)">
                                                <label for="" class="m-0">Do not contact site (after antisepsis)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvCan').value == '2' ? true : false"
                                                    class="mr-3" name="CanInsertNeedles" (change)="checkChange($event)">
                                                <label for="" class="m-0">Insert needles & Connect to blood lines
                                                    aseptically</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row align-items-start my-3 custom-title pt-4">
                                <h4 class="m-0">AV Decannulation</h4>
                                <div class="row align-items-center w-100">
                                    <div class="col-5">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="AvDecan"
                                                    (change)="radioChange($event)" name="AvDecan" class="mr-3"
                                                    value="2">
                                                <label class="m-0">Not Applicable</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="AvDecan"
                                                    (change)="radioChange($event)" name="AvDecan" value="1"
                                                    class="mr-3">
                                                <label class="m-0">No</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" disabled
                                                    [checked]="this.hemoDialysisFistulGraftForm.get('AvDecan').value === '0'"
                                                    name="AvDecan" class="mr-3">
                                                <label class="m-0">Yes</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-start">
                                            <input type="text" formControlName="AvDecanTxt"
                                                [readonly]="this.hemoDialysisFistulGraftForm.get('AvDecan').value === '2' ? false : true"
                                                class="w-50">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 my-2">
                                    <div class="row">
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanHandHygiene" (change)="checkChange($event)">
                                                <label for="" class="m-0">Perform hand hygiene</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanProperPpe" (change)="checkChange($event)">
                                                <label for="" class="m-0">Don proper PPE (mask with face shield or mask
                                                    with goggles, plus gown & gloves)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanDisconnectFrom"
                                                    (change)="checkChange($event)">
                                                <label for="" class="m-0">Discard tubing in a leak-proof
                                                    container</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanDiscardTubing"
                                                    (change)="checkChange($event)">
                                                <label for="" class="m-0">Wear clean gloves (patient and/or staff) to
                                                    compress site</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanWearClean" (change)="checkChange($event)">
                                                <label for="" class="m-0">Disconnect catheter from blood lines
                                                    aseptically</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanRemoveNeedles"
                                                    (change)="checkChange($event)">
                                                <label for="" class="m-0">Remove needles aseptically</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('AvDecan').value == '2' ? true : false"
                                                    class="mr-3" name="DecanApplyClean" (change)="checkChange($event)">
                                                <label for="" class="m-0">Apply clean gauze/bandage to site</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row align-items-start my-3 custom-title pt-4">
                                <h4 class="m-0">Medication Preparation</h4>
                                <div class="row align-items-center w-100">
                                    <div class="col-5">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="MedicationPrep"
                                                    (change)="radioChange($event)" name="MedicationPrep" class="mr-3"
                                                    value="2">
                                                <label class="m-0">Not Applicable</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="MedicationPrep"
                                                    (change)="radioChange($event)" name="MedicationPrep" value="1"
                                                    class="mr-3">
                                                <label class="m-0">No</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" disabled
                                                    [checked]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value === '0'"
                                                    name="MedicationPrep" class="mr-3">
                                                <label class="m-0">Yes</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-start">
                                            <input type="text" formControlName="MedicationPrepTxt"
                                                [readonly]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value === '2' ? false : true"
                                                class="w-50">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 my-2">
                                    <div class="row">
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepHandHygiene" (change)="checkChange($event)">
                                                <label for="" class="m-0">Perform hand hygiene</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepMedications" (change)="checkChange($event)">
                                                <label for="" class="m-0">Prepare medications in clean designated
                                                    areas</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepInspectVials" (change)="checkChange($event)">
                                                <label for="" class="m-0">Inspect all vials</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepAsepticTechniq"
                                                    (change)="checkChange($event)">
                                                <label for="" class="m-0">Prepare medications using antiseptic
                                                    techniques</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepNewNeedle" (change)="checkChange($event)">
                                                <label for="" class="m-0">Use new needle and new syringe to enter all
                                                    vials</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepDiscardAll" (change)="checkChange($event)">
                                                <label for="" class="m-0">Discard all single dose vial(s)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationPrep').value == '2' ? true : false"
                                                    class="mr-3" name="PrepProperlyStore"
                                                    (change)="checkChange($event)">
                                                <label for="" class="m-0">Discard or properly store all multi dose
                                                    vial(s)</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row align-items-start my-4 custom-title pt-4">
                                <h4 class="m-0">Medication Administration</h4>
                                <div class="row align-items-center w-100">
                                    <div class="col-5">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="MedicationAdm"
                                                    (change)="radioChange($event)" name="MedicationAdm" class="mr-3"
                                                    value="2">
                                                <label class="m-0">Not Applicable</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="MedicationAdm"
                                                    (change)="radioChange($event)" name="MedicationAdm" value="1"
                                                    class="mr-3">
                                                <label class="m-0">No</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" disabled
                                                    [checked]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value === '0'"
                                                    name="MedicationAdm" class="mr-3">
                                                <label class="m-0">Yes</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-start">
                                            <input type="text" formControlName="MedicationAdmTxt"
                                                [readonly]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value === '2' ? false : true"
                                                class="w-50">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 mb-2">
                                    <div class="row">
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value == '2' ? true : false"
                                                    class="mr-3" name="AdmHandHygiene" (change)="checkChange($event)">
                                                <label for="" class="m-0">Perform hand hygiene (before and
                                                    after)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value == '2' ? true : false"
                                                    class="mr-3" name="AdmProperPpe" (change)="checkChange($event)">
                                                <label for="" class="m-0">Use proper PPE (gloves)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value == '2' ? true : false"
                                                    class="mr-3" name="AdmProperlyTrans" (change)="checkChange($event)">
                                                <label for="" class="m-0">Properly transport medication to patient
                                                    station</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value == '2' ? true : false"
                                                    class="mr-3" name="AdmInjectionPort" (change)="checkChange($event)">
                                                <label for="" class="m-0">Disinfect injection port with appropiate
                                                    antiseptic</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value == '2' ? true : false"
                                                    class="mr-3" name="AdmAdministerMed" (change)="checkChange($event)">
                                                <label for="" class="m-0">Administer medications using aseptic
                                                    techniques</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('MedicationAdm').value == '2' ? true : false"
                                                    class="mr-3" name="AdmDiscardSyringe"
                                                    (change)="checkChange($event)">
                                                <label for="" class="m-0">Discard syringe point of use</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row align-items-start my-4 custom-title pt-4">
                                <h4 class="m-0">Dialysis Station</h4>
                                <div class="row align-items-center w-100">
                                    <div class="col-5">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="DialysisStat"
                                                    (change)="radioChange($event)" name="DialysisStat" class="mr-3"
                                                    value="2">
                                                <label class="m-0">Not Applicable</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" formControlName="DialysisStat"
                                                    (change)="radioChange($event)" name="DialysisStat" value="1"
                                                    class="mr-3">
                                                <label class="m-0">No</label>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <input type="radio" disabled
                                                    [checked]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value === '0'"
                                                    name="DialysisStat" class="mr-3">
                                                <label class="m-0">Yes</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-start">
                                            <input type="text" formControlName="DialysisStatTxt"
                                                [readonly]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value === '2' ? false : true"
                                                class="w-50">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 mb-2">
                                    <div class="row">
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value == '2' ? true : false"
                                                    class="mr-3" name="StatProperPpe" (change)="checkChange($event)">
                                                <label for="" class="m-0">Don proper PPE (as per indication but at least
                                                    use
                                                    gloves)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value == '2' ? true : false"
                                                    class="mr-3" name="StatEnsureThat" (change)="checkChange($event)">
                                                <label for="" class="m-0">Ensure that the patient has left the dialysis
                                                    station
                                                    before cleaning</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value == '2' ? true : false"
                                                    class="mr-3" name="StatDiscardAll" (change)="checkChange($event)">
                                                <label for="" class="m-0">Discard all single-use supplies, Clean and
                                                    disinfect
                                                    reusable equipment</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value == '2' ? true : false"
                                                    class="mr-3" name="StatNursingClean" (change)="checkChange($event)">
                                                <label for="" class="m-0">Nursing:Clean and disinfect dialysis
                                                    station(Dialysis
                                                    machine and bedside table)</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value == '2' ? true : false"
                                                    class="mr-3" name="StatKeepUsed" (change)="checkChange($event)">
                                                <label for="" class="m-0">Keep used or potentially contaminated items
                                                    away from
                                                    the
                                                    disinfected surfaces</label>
                                            </div>
                                        </div>
                                        <div class="col-4 my-2">
                                            <div class="d-flex align-items-center my-2">
                                                <input type="checkbox" #checkbox class="mr-3"
                                                    [disabled]="this.hemoDialysisFistulGraftForm.get('DialysisStat').value == '2' ? true : false"
                                                    class="mr-3" name="StatHousekeeping" (change)="checkChange($event)">
                                                <label for="" class="m-0">Housekeeping: Clean and disinfect dialysis
                                                    chair or bed (rails, armrests & mattresses)</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row align-items-start my-4 custom-title">
                                <div class="col-12 my-2">
                                    <div class="d-flex align-items-center my-2">
                                        <label for="" class="col-3">Signs of Fistula/Graft Infections</label>
                                        <input type="text" formControlName="SignsFistulaGraft" class="col-9">
                                    </div>
                                </div>
                                <div class="col-12 my-2">
                                    <div class="d-flex align-items-center my-2">
                                        <label for="" class="col-3">Comments</label>
                                        <input type="text" formControlName="Comments" class="col-9">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
