<div class="hemo-catheter-main bg-white mt-4">
    <form>
        <div class="hemo-catheter-info">
            <div class="container-fluid">
                <div class="custom-title">
                    <div class="row align-items-center my-4">
                        <h4 class="m-0">Blood draw Precaution</h4>
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Patient Name</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-3"></div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">MRN</label>
                                <input type="number" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">DOB</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-3"></div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">Gender</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Location</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-3"></div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap" style="min-width: 50px;">Case</label>
                                <input type="number" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Day Since Admission</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-3"></div>
                        <div class="col-3"></div>
                    </div>
                </div>
                <div class="custom-title my-4">
                    <div class="row align-items-center my-4">
                        <h4 class="m-0">Bundle Elements</h4>
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Session Date</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-3"></div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Sesstion Time</label>
                                <input type="number" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Catheter Days</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-6"></div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Date of catheter insertion</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-6"></div>
                    </div>
                    <div class="row align-items-center my-4">
                        <div class="col-6">
                            <div class="d-flex align-items-center">
                                <label for="" class="mr-3 mb-0 text-nowrap">Date of catheter removal</label>
                                <input type="text" class="w-100" formControlName="BloodDrawTxt">
                            </div>
                        </div>
                        <div class="col-6"></div>
                    </div>
                </div>

                <div class="row align-items-start my-4 custom-title">
                    <h4 class="m-0">Medication Preparation</h4>
                    <div class="col-2 my-2">
                        <div class="d-flex flex-column align-items-start">
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">Yes</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">No</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">Not Applicable</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="text" name="" id="">
                            </div>
                        </div>
                    </div>
                    <div class="col-10 my-2">
                        <div class="row">
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Perform hand hygiene</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Prepare medications in clean designated areas</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Inspect all vials</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Prepare medications using antiseptic techniques</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Use new needle and new syringe to enter all vials</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Discard all single dose vial(s)</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Discard or properly store all multi dose vial(s)</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row align-items-start my-4 custom-title">
                    <h4 class="m-0">Medication Administration</h4>
                    <div class="col-2 my-2">
                        <div class="d-flex flex-column align-items-start">
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">Yes</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">No</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">Not Applicable</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="text" name="" id="">
                            </div>
                        </div>
                    </div>
                    <div class="col-10 my-2">
                        <div class="row">
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Perform hand hygiene (before and after)</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Use proper PPE (gloves)</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Properly transport medication to patient station</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Disinfect injection port with appropiate antiseptic</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Administer medications using aseptic techniques</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Discard syringe point of use</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row align-items-start my-4 custom-title">
                    <h4 class="m-0">Dialysis Station</h4>
                    <div class="col-2 my-2">
                        <div class="d-flex flex-column align-items-start">
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">Yes</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">No</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="checkbox" class="mr-3" formControlName="HaAFistula">
                                <label for="" class="m-0">Not Applicable</label>
                            </div>
                            <div class="d-flex align-items-center my-2">
                                <input type="text" name="" id="">
                            </div>
                        </div>
                    </div>
                    <div class="col-10 my-2">
                        <div class="row">
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Don proper PPE (as per indication but at least use gloves)</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Ensure that the patient has left the dialysis station before cleaning</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Discard all single-use supplies, Clean and disinfect reusable equipment</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Nursing:Clean and disinfect dialysis station(Dialysis machine and bedside table)</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Keep used or potentially contaminated items away from the disinfected surfaces</label>
                                </div>
                            </div>
                            <div class="col-4 my-2">
                                <div class="d-flex align-items-center my-2">
                                    <input type="checkbox" class="mr-3" formControlName="HaATransLumbar">
                                    <label for="" class="m-0">Housekeeping: Clean and disinfect dialysis chair or bed (rails, armrests & mattresses)</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row align-items-start my-4 custom-title">
                    <div class="col-12 my-2">
                        <div class="d-flex align-items-center my-2">
                            <label for="" class="col-3">Signs of Catheter-site Infections</label>
                            <input type="text" name="" id="" class="col-9">
                        </div>
                    </div>
                    <div class="col-12 my-2">
                        <div class="d-flex align-items-center my-2">
                            <label for="" class="col-3">Comments</label>
                            <input type="text" name="" id="" class="col-9">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
