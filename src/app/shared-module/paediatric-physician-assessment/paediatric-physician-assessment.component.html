<div class="nursing-admission-main">
    <div>
        <app-admission-data-section [isFormValidError]="isFormValidError"
            [nursingAdmissionForm]="nursingAdmissionForm"></app-admission-data-section>
    </div>

    <div class="end-container">
        <div class="scale-box-main">
            <label class="box-label">Allergies</label>
            <div class="container-fluid">
                <div class="tab-navigation-part p-0 mt-3">
                    <div class="tab-navigate allergies-header">
                        <div class="tab-nav mb-3 align-items-center">
                            <label class="m-0">Allergies</label>
                            <input type="text" class="form-control w-70" [value]="
                      toAllergyArr.length ? 'Allergy Exists' : 'No Known Allergies'
                    " />
                        </div>
                        <div class="" (click)="openModalForAllergy()">
                            <img src="assets/img/file1.svg" title="Create & Import" class="img-size" />
                        </div>
                    </div>
                    <div class="tab-content">
                        <div>
                            <div class="allergy-box">
                                <table class="table table-bordered past-table">
                                    <thead>
                                        <tr>
                                            <th scope="col">Group</th>
                                            <th scope="col">Description</th>
                                            <th scope="col">Delete</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let item of toAllergyArr; let i = index">
                                            <td>{{ item.Agroup || item.AllergenGrp }}</td>
                                            <td>{{ item.Description || item.Allergen }}</td>
                                            <td>
                                                <img src="assets/img/Delete.svg" alt="delete"
                                                    (click)="deleteFromAllergy(item, i)" />
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- vital section -->
    <div class="end-container">
        <div class="scale-box-main">
            <label class="box-label">Vitals</label>
            <div class="container-fluid">
                <div class="tab-navigation-part p-0">
                    <div class="container-fluid">
                        <div class="allergy-box d-flex justify-content-between py-3">
                            <div class="allergy-checkbox-section d-flex align-items-center">
                                <input type="checkbox" id="noVitalSignsApplicable"
                                    (change)="handleCheckboxVitals($event)" style="width: 24px; height: 20px"
                                    [attr.disabled]="toVitalsArr?.length > 0 ? true : null" />
                                <label class="admitting-physician" for="noVitalSignsApplicable">&nbsp;&nbsp;No Vitals
                                    Signs Applicable</label>
                            </div>
                            <div class="secound-bar-vital-sign" (click)="openModalVital()">
                                <img src="assets/img/file1.svg" title="Create & Import" class="img-size" />
                            </div>
                        </div>
                        <div style="max-height: 296px; overflow: auto">
                            <table class="table table-bordered past-table">
                                <thead style="background-color: #e4edf5; color: black">
                                    <tr>
                                        <th scope="col">Description</th>
                                        <th scope="col">Measured Value</th>
                                        <th scope="col">Normal Range</th>
                                        <th scope="col">Date/Time</th>
                                        <th scope="col"></th>
                                    </tr>
                                </thead>
                                <tbody style="background-color: #fbfcff">
                                    <tr class="past-med-input" *ngFor="let item of toVitalsArr; let i = index">
                                        <td style="
                                    padding: 10px !important;
                                    width: 15%;
                                    pointer-events: none;
                                  ">
                                            {{ item.Vdescription }}
                                        </td>
                                        <td style="
                                    padding: 10px !important;
                                    width: 15%;
                                    pointer-events: none;
                                  ">
                                            {{ item.MeasuredValue }} {{ item.Vunit }}
                                        </td>
                                        <td style="
                                    padding: 10px !important;
                                    width: 15%;
                                    pointer-events: none;
                                  ">
                                            {{ item.NormalRange }}
                                        </td>
                                        <td style="
                                    padding: 10px !important;
                                    width: 15%;
                                    pointer-events: none;
                                  ">
                                            {{ item.DateTime }}
                                        </td>
                                        <td style="
                                    padding: 10px !important;
                                    width: 3%;
                                    text-align: center;
                                  " (click)="deleteVitalsFromTable(i)">
                                            <img src="assets/img/Delete.svg" />
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div>
        <app-vaccination-exposure-section [nursingAdmissionForm]="nursingAdmissionForm"
            (addTableRow)="addTableRow($event)"></app-vaccination-exposure-section>
    </div>
    <div>
        <app-psychological-economic></app-psychological-economic>
    </div>
    <div>
        <app-physical-assessment-section
            [nursingAdmissionForm]="nursingAdmissionForm"></app-physical-assessment-section>
    </div>
    <div>
        <app-examination-tab [nursingAdmissionForm]="nursingAdmissionForm"></app-examination-tab>
    </div>
    <div>
        <app-assessment-tab [nursingAdmissionForm]="nursingAdmissionForm"></app-assessment-tab>
    </div>
</div>
