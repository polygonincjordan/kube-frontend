<div class="haemodialysis-main">
    <form [formGroup]="MorsefallForm">
        <div class="haemodialysis-info">
            <div class="container-fluid" style="padding: 0px;">
                <div class="haemodialysis-dialysis-info position-relative p-3 mb-4 mt-4">
                    <label for="" class="title-text m-0">Scale Information</label>
                    <div class=" my-3">
                       <div class="d-flex align-items-center">
                            <div class="col-6 px-0 mb-2">
                                <div class="row align-items-center w-100 custom-input">
                                    <label for="" class="text-nowrap m-0 col-2">Scale Name</label>
                                    <input type="text" class="col-6" value="Morse Fall Scale (MFS)" style="width: 100%;"
                                        disabled>
                                </div>
                            </div>
                            <div class="col-6 px-0 ">
                                <div class="row align-items-center w-100 custom-input">
                                    <label for="" class="text-nowrap m-0 col-2">Realized by</label>
                                    <input type="text" class="col-2" formControlName="AttendPhy" readonly>
                                    <input type="text" class="col-4" [value]="realizedDescription" disabled>
                                </div>
                            </div>
                       </div>
                        <div class="col-6 px-0 mb-2">
                            <div class="row align-items-center w-100 custom-input">
                                <label for="" class="text-nowrap m-0 col-2">Date</label>
                                <input type="text" class="col-2" bsDatepicker
                                    [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false }"
                                    [bsValue]="CurrentDateAndTime" disabled>
                                <input type="text" class="col-2" bsDatepicker
                                    [bsConfig]="{ dateInputFormat: 'hh:mm:ss', showWeekNumbers: false }"
                                    [bsValue]="CurrentDateAndTime" disabled>
                            </div>
                        </div>
                       
                    </div>
                </div>
                <div class="haemodialysis-dialysis-info position-relative p-3 mb-5">
                    <label for="" class="title-text m-0">NIPS Assessment</label>
                    <div class="haemodialysis-content my-3">
                        <div class="d-flex my-3 risk-wrap">
                            <label for="" class="common-label m-0">Facial Expression</label>
                            <div class="d-flex align-items-center custom-input mr-5 ">
                                <div class="d-flex align-items-center ">
                                    <input type="radio" value="A" name="HistoryFalls" formControlName="HistoryFalls" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Not answered</label>
                                </div>
                                <div class="d-flex align-items-center ">
                                    <input type="radio" value="1" name="HistoryFalls" formControlName="HistoryFalls" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Relaxed</label>
                                </div>
                                <div class="d-flex align-items-center ">
                                    <input type="radio" value="0" name="HistoryFalls" formControlName="HistoryFalls" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Contracted</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex my-3 risk-wrap">
                            <label for="" class="common-label m-0">Cry</label>
                            <div class="custom-input d-flex mr-5">
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="A" name="SecondaryDiagnosis"
                                        formControlName="SecondaryDiagnosis" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Not answered</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="1" name="SecondaryDiagnosis"
                                        formControlName="SecondaryDiagnosis" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Absent</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="0" name="SecondaryDiagnosis"
                                        formControlName="SecondaryDiagnosis" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Mumbling</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="0" name="SecondaryDiagnosis"
                                        formControlName="SecondaryDiagnosis" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Screaming</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex my-3 risk-wrap">
                            <label for="" class="common-label m-0">Breathing patterns</label>
                            <div class="custom-input d-flex mr-5">
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="A" name="AmbulatoryAid" formControlName="AmbulatoryAid" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Not answered</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="F" name="AmbulatoryAid" formControlName="AmbulatoryAid" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Regular</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="C" name="AmbulatoryAid" formControlName="AmbulatoryAid" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Different than basal</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex my-3 risk-wrap">
                            <label for="" class="common-label m-0">Arms</label>
                            <div class="custom-input d-flex mr-5">
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="A" name="IvAccess" formControlName="IvAccess" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Not answered</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="1" name="IvAccess" formControlName="IvAccess" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Relaxed</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="0" name="IvAccess" formControlName="IvAccess" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Flexed</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex my-3 risk-wrap">
                            <label for="" class="common-label m-0">Leg</label>
                            <div class="d-flex custom-input mr-5">
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="A" name="Gait" formControlName="Gait" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Not answered</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="I" name="Gait" formControlName="Gait" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Relaxed</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="W" name="Gait" formControlName="Gait" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Flexed/stretched</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex mt-3 risk-wrap">
                            <label for="" class="common-label m-0">State of arousal</label>
                            <div class="custom-input d-flex mr-5">
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="A" name="MentalStatus" formControlName="MentalStatus" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Not answered</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="F" name="MentalStatus" formControlName="MentalStatus" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Sleeping/Calm</label>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" value="O" name="MentalStatus" formControlName="MentalStatus" (change)="calculateTotal()">
                                    <label for="" class="mx-3">Uncomfortable</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="haemodialysis-dialysis-info position-relative p-3 mb-5">
                    <label for="" class="title-text m-0">Scale Result</label>
                    <div class=" my-3">
                        <div class="col-6 px-0">
                            <div class="row align-items-center w-100 custom-input">
                                <label for="" class="text-nowrap m-0 col-2">Total score</label>
                                <input type="text" class="col-2" [value]="totalScore" readonly>
                                <input type="text" class="col-7" [value]="description" readonly>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="haemodialysis-dialysis-info position-relative p-3 mb-4">
                    <div class=" my-0">
                        <div class="col-8 px-0">
                            <div class="row align-items-center w-100 custom-input">
                                <label for="" class="text-nowrap m-0 col-1 morse-label-comments">Comments</label>
                                <input type="text" class="col-10" style="width: 100%;"
                                    formControlName="Comments">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
