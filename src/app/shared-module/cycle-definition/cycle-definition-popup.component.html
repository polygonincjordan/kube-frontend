<ng-template #cycleDefinition>
  <div class="cycle-def">
    <!-- Header -->
    <div class="cycle-def__header">
      <div class="cycle-def__heading">
        <h5 class="m-0">Cycle Definition</h5>
        <small *ngIf="title">{{ title }}</small>
      </div>
      <button type="button" class="cycle-def__close" (click)="cancel()" aria-label="Close cycle definition">&times;</button>
    </div>

    <!-- Cycle tabs (0001, 0002 …) — one per received line, driven by the data -->
    <div class="cycle-def__tabs" [formGroup]="cycleForm">
      <ng-container formArrayName="cycles">
        <span *ngFor="let cycle of cycles.controls; let i = index"
          class="cycle-def__tab c-pointer" [class.active]="activeTab === i" (click)="selectTab(i)">
          {{ tabLabel(i) }}
        </span>
      </ng-container>
    </div>

    <!-- Body -->
    <div class="cycle-def__body" [formGroup]="cycleForm">
      <ng-container formArrayName="cycles">
        <div *ngFor="let cycle of cycles.controls; let i = index" [formGroupName]="i" [hidden]="activeTab !== i">

          <!-- From / To date -->
          <div class="cycle-def__grid2">
            <div class="cycle-def__row">
              <label class="cycle-def__label" for="cd-from-date-{{i}}">From Date</label>
              <input id="cd-from-date-{{i}}" type="text" class="form-control cycle-def__field" formControlName="Begdt"
                bsDatepicker container="body"
                [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false, containerClass: 'theme-default' }">
            </div>
            <div class="cycle-def__row">
              <label class="cycle-def__label" for="cd-to-date-{{i}}">To Date</label>
              <input id="cd-to-date-{{i}}" type="text" class="form-control cycle-def__field" formControlName="Enddt"
                bsDatepicker container="body" [minDate]="cycle.get('Begdt').value"
                [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false, containerClass: 'theme-default' }">
            </div>
          </div>

          <!-- Scheduling panel -->
          <div class="cycle-def__section">
            <div class="cycle-def__regularly-row">
              <input type="radio" id="cd-regularly-{{i}}" checked class="cycle-def__regularly" tabindex="-1" aria-hidden="true">
              <label for="cd-regularly-{{i}}" class="m-0 cycle-def__section-title">Regularly</label>
            </div>

            <!-- Qty + multiple day fixed interval -->
            <div class="cycle-def__grid2">
              <div class="cycle-def__row">
                <label class="cycle-def__label" for="cd-qty-{{i}}">Qty</label>
                <input id="cd-qty-{{i}}" type="number" min="1" class="form-control cycle-def__field" formControlName="Menge">
              </div>
              <div class="cycle-def__check">
                <input type="checkbox" id="cd-mdfi-{{i}}" formControlName="multipleDayFixedInterval">
                <label for="cd-mdfi-{{i}}" class="m-0">Multiple Day Fixed Interval</label>
              </div>
            </div>

            <!-- Week days + Every Day / Every N day -->
            <div class="cycle-def__grid2">
              <div class="cycle-def__weekdays" role="group" aria-label="Week days">
                <label class="cycle-def__day"><input type="checkbox" formControlName="Mo"> Mo</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="Tu"> Tu</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="We"> We</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="Th"> Th</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="Fr"> Fr</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="Sa"> Sat</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="Su"> Sun</label>
                <label class="cycle-def__day"><input type="checkbox" formControlName="PublHol"> Publ.Hol.</label>
              </div>
              <div class="cycle-def__interval" role="radiogroup" aria-label="Day interval">
                <div class="cycle-def__check">
                  <input type="radio" id="cd-everyday-{{i}}" formControlName="everyDay" [value]="true">
                  <label for="cd-everyday-{{i}}" class="m-0">Every Day</label>
                </div>
                <div class="cycle-def__check">
                  <input type="radio" id="cd-everyn-{{i}}" formControlName="everyDay" [value]="false">
                  <label for="cd-everyn-{{i}}" class="m-0 mr-2">Every</label>
                  <input type="number" min="1" class="form-control cycle-def__num" formControlName="IntervalDay"
                    aria-label="Number of days" [readonly]="cycle.get('everyDay').value">
                  <span class="ml-2">Day</span>
                </div>
              </div>
            </div>

            <!-- From / To time + interval -->
            <div class="cycle-def__grid2">
              <div>
                <div class="cycle-def__row mb-2">
                  <label class="cycle-def__label" for="cd-from-time-{{i}}">From Time</label>
                  <input id="cd-from-time-{{i}}" type="time" class="form-control cycle-def__field" formControlName="fromTime">
                </div>
                <div class="cycle-def__row">
                  <label class="cycle-def__label" for="cd-to-time-{{i}}">To Time</label>
                  <input id="cd-to-time-{{i}}" type="time" class="form-control cycle-def__field" formControlName="toTime">
                </div>
              </div>
              <div class="cycle-def__interval" role="radiogroup" aria-label="Time interval">
                <div class="cycle-def__check">
                  <input type="radio" id="cd-hours-{{i}}" formControlName="intervalMode" value="hours">
                  <label for="cd-hours-{{i}}" class="m-0 mr-2">Every</label>
                  <input type="text" class="form-control cycle-def__num" formControlName="IntervalHour"
                    aria-label="Number of hours" [readonly]="cycle.get('intervalMode').value !== 'hours'">
                  <span class="ml-2">Hour(s)</span>
                </div>
                <div class="cycle-def__check">
                  <input type="radio" id="cd-minutes-{{i}}" formControlName="intervalMode" value="minutes">
                  <label for="cd-minutes-{{i}}" class="m-0 mr-2">Every</label>
                  <input type="text" class="form-control cycle-def__num" formControlName="IntervalMinute"
                    aria-label="Number of minutes" [readonly]="cycle.get('intervalMode').value !== 'minutes'">
                  <span class="ml-2">Minute(s)</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Footer -->
    <div class="cycle-def__footer">
      <button type="button" class="cycle-def__btn cycle-def__save" (click)="save()">Save</button>
      <button type="button" class="cycle-def__btn cycle-def__cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</ng-template>
