<ng-template #cycleDefinition>
  <div class="cycle-def">
    <!-- Header -->
    <div class="cycle-def__header d-flex justify-content-between align-items-start">
      <div>
        <h5 class="m-0 font-weight-bold">Cycle Definition</h5>
        <small *ngIf="title" class="d-block">{{ title }}</small>
      </div>
      <img src="assets/img/close.svg" height="20" class="c-pointer cycle-def__close" (click)="cancel()" alt="close">
    </div>

    <!-- Cycle tabs (0001, 0002 …) -->
    <div class="cycle-def__tabs d-flex align-items-center px-3 pt-3" [formGroup]="cycleForm">
      <ng-container formArrayName="cycles">
        <span *ngFor="let cycle of cycles.controls; let i = index"
          class="cycle-def__tab c-pointer mr-3 d-flex align-items-center"
          [class.active]="activeTab === i" (click)="selectTab(i)">
          {{ tabLabel(i) }}
          <img *ngIf="cycles.length > 1" src="assets/img/delete-icon.svg" height="14" class="ml-1"
            (click)="$event.stopPropagation(); removeCycle(i)" alt="remove">
        </span>
      </ng-container>
      <span class="cycle-def__add c-pointer d-flex align-items-center" (click)="addCycle()">
        <img src="assets/img/add.png" height="16" class="mr-1" alt="add"> Add
      </span>
    </div>

    <!-- Active cycle body -->
    <div class="cycle-def__body p-3" [formGroup]="cycleForm">
      <ng-container formArrayName="cycles">
        <div *ngFor="let cycle of cycles.controls; let i = index" [formGroupName]="i"
          [hidden]="activeTab !== i">

          <!-- From / To date -->
          <div class="row mb-3">
            <div class="col-12 col-md-6 d-flex align-items-center mb-2 mb-md-0">
              <label class="cycle-def__label mb-0 mr-2">From Date</label>
              <input type="text" class="form-control" formControlName="Begdt" bsDatepicker
                [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false, containerClass: 'theme-default' }">
            </div>
            <div class="col-12 col-md-6 d-flex align-items-center">
              <label class="cycle-def__label mb-0 mr-2">To Date</label>
              <input type="text" class="form-control" formControlName="Enddt" bsDatepicker
                [minDate]="cycle.get('Begdt').value"
                [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false, containerClass: 'theme-default' }">
            </div>
          </div>

          <div class="cycle-def__section p-3">
            <div class="d-flex align-items-center mb-3">
              <input type="radio" id="regularly{{i}}" [checked]="true" disabled class="mr-2">
              <label for="regularly{{i}}" class="mb-0 font-weight-bold">Regularly</label>
            </div>

            <!-- Qty + multiple day fixed interval -->
            <div class="row mb-3 align-items-center">
              <div class="col-12 col-md-6 d-flex align-items-center mb-2 mb-md-0">
                <label class="cycle-def__label mb-0 mr-2">Qty</label>
                <input type="number" min="1" class="form-control" formControlName="Menge">
              </div>
              <div class="col-12 col-md-6 d-flex align-items-center">
                <input type="checkbox" id="mdfi{{i}}" formControlName="multipleDayFixedInterval" class="mr-2">
                <label for="mdfi{{i}}" class="mb-0">Multiple Day Fixed Interval</label>
              </div>
            </div>

            <!-- Week days + Every Day / Every N day -->
            <div class="row mb-3">
              <div class="col-12 col-md-7 mb-3 mb-md-0">
                <div class="cycle-def__weekdays">
                  <label class="cycle-def__day"><input type="checkbox" formControlName="Mo"> Mo</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="Tu"> Tu</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="We"> We</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="Th"> Th</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="Fr"> Fr</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="Sa"> Sat</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="Su"> Sun</label>
                  <label class="cycle-def__day"><input type="checkbox" formControlName="PublHol"> Publ.Hol.</label>
                </div>
              </div>
              <div class="col-12 col-md-5">
                <div class="d-flex align-items-center mb-2">
                  <input type="radio" id="everyDay{{i}}" formControlName="everyDay" [value]="true" class="mr-2">
                  <label for="everyDay{{i}}" class="mb-0">Every Day</label>
                </div>
                <div class="d-flex align-items-center">
                  <input type="radio" id="everyN{{i}}" formControlName="everyDay" [value]="false" class="mr-2">
                  <label for="everyN{{i}}" class="mb-0 mr-2">Every</label>
                  <input type="number" min="1" class="form-control cycle-def__num" formControlName="IntervalDay"
                    [readonly]="cycle.get('everyDay').value">
                  <span class="ml-2">Day</span>
                </div>
              </div>
            </div>

            <!-- From / To time + interval -->
            <div class="row">
              <div class="col-12 col-md-7 mb-3 mb-md-0">
                <div class="d-flex align-items-center mb-2">
                  <label class="cycle-def__label mb-0 mr-2">From Time</label>
                  <input type="time" class="form-control" formControlName="fromTime">
                </div>
                <div class="d-flex align-items-center">
                  <label class="cycle-def__label mb-0 mr-2">To Time</label>
                  <input type="time" class="form-control" formControlName="toTime">
                </div>
              </div>
              <div class="col-12 col-md-5">
                <div class="d-flex align-items-center mb-2">
                  <input type="radio" id="hours{{i}}" formControlName="intervalMode" value="hours" class="mr-2">
                  <label for="hours{{i}}" class="mb-0 mr-2">Every</label>
                  <input type="text" class="form-control cycle-def__num" formControlName="IntervalHour"
                    [readonly]="cycle.get('intervalMode').value !== 'hours'">
                  <span class="ml-2">Hour(s)</span>
                </div>
                <div class="d-flex align-items-center">
                  <input type="radio" id="minutes{{i}}" formControlName="intervalMode" value="minutes" class="mr-2">
                  <label for="minutes{{i}}" class="mb-0 mr-2">Every</label>
                  <input type="text" class="form-control cycle-def__num" formControlName="IntervalMinute"
                    [readonly]="cycle.get('intervalMode').value !== 'minutes'">
                  <span class="ml-2">Minute(s)</span>
                </div>
              </div>
            </div>

            <!-- Comment -->
            <div class="d-flex mt-3">
              <label class="cycle-def__label mb-0 mr-2 pt-1">Comment</label>
              <textarea class="form-control" rows="2" formControlName="Comment"></textarea>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Footer -->
    <div class="cycle-def__footer d-flex justify-content-end p-3">
      <button type="button" class="btn cycle-def__save mr-2" (click)="save()">Save</button>
      <button type="button" class="btn cycle-def__cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</ng-template>
