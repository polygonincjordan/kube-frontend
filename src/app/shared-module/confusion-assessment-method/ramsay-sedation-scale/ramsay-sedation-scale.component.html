<ng-template #scaleRamsaySedationModal>
    <div>
        <div class="allergy-header">
            <div class="allergy-header-title">
                <span>Ramsay Sedation Scale</span>
            </div>
            <div class="allergy-header-details">
                <ul class="allergy-header-ul d-flex">
                    <li class="close-icon">
                        <img width="20" src="assets/img/CloseTab.svg" class="img-size cursor-pointer"
                            (click)="closeGlosgowModel()" />
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="haemodialysis-main">
        <form [formGroup]="ramsaySedationForm">
            <div class="haemodialysis-info">
                <div class="container-fluid" style="padding: 0px;">
                    <div class="haemodialysis-dialysis-info position-relative p-3 mb-4 mt-4">
                        <label for="" class="title-text m-0">Scale Information</label>
                        <div class=" my-3">
                            <div class="d-flex align-items-center">
                                <div class="col-6 px-0 mb-2">
                                    <div class="row align-items-center w-100 custom-input">
                                        <label for="" class="text-nowrap m-0 col-2">Scale Name</label>
                                        <input type="text" class="col-6" value="Ramsay Sedation Scale"
                                            style="width: 100%;" disabled>
                                    </div>
                                </div>
                                <div class="col-6 px-0 ">
                                    <div class="row align-items-center w-100 custom-input">
                                        <label for="" class="text-nowrap m-0 col-2">Realized by</label>
                                        <input type="text" class="col-2" formControlName="AttendPhy" readonly>
                                        <input type="text" class="col-4" [value]="realizedDescription" disabled>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 px-0 mb-2">
                                <div class="row align-items-center w-100 custom-input">
                                    <label for="" class="text-nowrap m-0 col-2">Date</label>
                                    <input type="text" class="col-2" bsDatepicker
                                        [bsConfig]="{ dateInputFormat: 'DD.MM.YYYY', showWeekNumbers: false }"
                                        [bsValue]="CurrentDateAndTime" disabled>
                                    <input type="text" class="col-2" bsDatepicker
                                        [bsConfig]="{ dateInputFormat: 'hh:mm:ss', showWeekNumbers: false }"
                                        [bsValue]="CurrentDateAndTime" disabled>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="haemodialysis-dialysis-info position-relative p-3 mb-5">
                        <label for="" class="title-text m-0">Ramsay Sedation</label>
                        <div class="haemodialysis-content my-3 ml-5">
                            <div class="d-flex align-items-end my-3 risk-input-wrap">
                                <div class="row score-input">
                                    <label for="" class="common-label mb-4 col-1 pr-0 p-0">Score</label>
                                    <label for="" class="common-label m-0 col-5 px-0">Responsiveness</label>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">0</label>
                                <div class="custom-input mr-5 ">
                                    <div class="d-flex align-items-center ">
                                        <input type="radio" value="0" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(0)">
                                        <label for="" class="mx-3">Not answered</label>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">1</label>
                                <div class="custom-input mr-5">
                                    <div class="d-flex align-items-center">
                                        <input type="radio" value="1" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(1)">
                                        <label for="" class="mx-3">Patient is anxious and agitated and/or
                                            restless</label>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">2</label>
                                <div class="custom-input mr-5">
                                    <div class="d-flex align-items-center">
                                        <input type="radio" value="2" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(2)">
                                        <label for="" class="mx-3">Patient is cooperative, oriented and quiet</label>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">3</label>
                                <div class="custom-input mr-5">
                                    <div class="d-flex align-items-center">
                                        <input type="radio" value="3" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(3)">
                                        <label for="" class="mx-3">Patient responds to commands only</label>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">4</label>
                                <div class="custom-input mr-5">
                                    <div class="d-flex align-items-center">
                                        <input type="radio" value="4" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(4)">
                                        <label for="" class="mx-3">Patient exhibits brisk response to light glabellar
                                            tap</label>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">5</label>
                                <div class="custom-input mr-5">
                                    <div class="d-flex align-items-center">
                                        <input type="radio" value="5" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(5)">
                                        <label for="" class="mx-3">Patient exhibits a sluggish response to light
                                            glabellar tap</label>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex my-3 risk-wrap">
                                <label for="" class="common-label m-0">6</label>
                                <div class="custom-input mr-5">
                                    <div class="d-flex align-items-center">
                                        <input type="radio" value="6" name="Responsiveness"
                                            formControlName="Responsiveness" (change)="calculateTotal(6)">
                                        <label for="" class="mx-3">Patient exhibits no response</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="haemodialysis-dialysis-info position-relative p-3 mb-5">
                        <label for="" class="title-text m-0">Scale Result</label>
                        <div class=" my-3">
                            <div class="col-6 px-0">
                                <div class="row align-items-center w-100 custom-input">
                                    <label for="" class="text-nowrap m-0 col-2">Total score</label>
                                    <input type="text" class="col-2" formControlName="TotalScore" readonly>
                                    <input type="text" class="col-7" formControlName="ScoreDesc" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="haemodialysis-dialysis-info position-relative p-3 mb-4">
                        <div class=" my-0">
                            <div class="col-8 px-0">
                                <div class="row align-items-center w-100 custom-input">
                                    <label for="" class="text-nowrap m-0 col-1 morse-label-comments">Comments</label>
                                    <input type="text" class="col-10" style="width: 100%;" formControlName="Comments">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="col-md-12 mt-4" style="text-align: end" *ngIf="!dockeyValue">
            <button class="triage-model-btn" (click)="closeGlosgowModel()">Cancel</button>
            <button class="triage-model-btn" (click)="createRamsaySedation('1')">Save</button>
        </div>
    </div>
</ng-template>
