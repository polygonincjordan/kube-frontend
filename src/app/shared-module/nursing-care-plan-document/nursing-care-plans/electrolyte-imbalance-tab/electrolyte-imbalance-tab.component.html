<form class="tab-contant" [formGroup]="nursingCarePlanForm">
  <div class="nur-problem-details row">
    <div class="col-md-6">
      <div class="nutrotion-problem">
        <h4><strong>Problem</strong></h4>
        <div class="row">
          <div class="col-md-8">
            <input type="checkbox" formControlName="ElpElectrolyte" />
            <label>Electrolyte Imbalance</label>
          </div>
          <div class="col-md-4">
            <div>
              <input
                type="checkbox"
                formControlName="ElpActual"
                (change)="onCheckboxChange('ElpActual', ['ElpPotential'])"
              />
              <label>Actual</label>
            </div>
            <div>
              <input
                type="checkbox"
                formControlName="ElpPotential"
                (change)="onCheckboxChange('ElpPotential', ['ElpActual'])"
              />
              <label>Potential</label>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="nutrotion-problem">
        <h4><strong>Goals</strong></h4>
        <div class="">
          <div>
            <input type="checkbox" formControlName="ElgNotExperience" />
            <label>The patient will Not experience fluid volume deficit</label>
          </div>
          <div>
            <input type="checkbox" formControlName="ElgDemonstrate" />
            <label
              >The patient will demonstrate stable electrolyte values</label
            >
          </div>
          <div>
            <input type="checkbox" formControlName="ElgTwitching" />
            <label>Absence of twitching, muscle weakness</label>
          </div>
          <div>
            <input type="checkbox" formControlName="ElgCardiac" />
            <label>Absence of cardiac dysrhythmias</label>
          </div>
          <div>
            <input type="checkbox" formControlName="ElgNormal" />
            <label>Normal skin turgor</label>
          </div>
          <div class="d-flex">
            <input type="checkbox" formControlName="ElgOthers" />
            <label class="mr-3">Others</label>
            <input
              type="text"
              formControlName="ElgOthersTxt"
              class="form-control"
              [readOnly]="nursingCarePlanForm.get('ElgOthers').value == false"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="nur-interventions-details mt-3">
    <div class="nutrotion-problem">
      <h4><strong>Interventions</strong></h4>
      <div class="row">
        <div class="col-md-6">
          <div>
            <input type="checkbox" formControlName="EliAdminister" />
            <label>Administer medications, as ordered</label>
          </div>
          <div>
            <input type="checkbox" formControlName="EliOral" />
            <label>Monitor Oral fluid/food intake</label>
          </div>
          <div>
            <input type="checkbox" formControlName="EliVital" />
            <label>Monitor vital signs, as ordered</label>
          </div>
          <div>
            <input type="checkbox" formControlName="EliBlood" />
            <label>Monitor blood serum electrolytes</label>
          </div>
        </div>
        <div class="col-md-6">
          <div>
            <input type="checkbox" formControlName="EliIntake" />
            <label>Monitor intake and output</label>
          </div>
          <div>
            <input type="checkbox" formControlName="EliEcg" />
            <label>Monitor ECG</label>
          </div>
          <div>
            <input type="checkbox" formControlName="EliEducate" />
            <label class="mr-3">Educate the patient and family</label>
          </div>
          <div class="d-flex">
            <input type="checkbox" formControlName="EliOthers" />
            <label class="mr-3">Others</label>
            <input
              type="text"
              formControlName="EliOthersTxt"
              class="form-control"
              [readOnly]="nursingCarePlanForm.get('EliOthers').value == false"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="nur-problem-details row mt-3">
    <div class="col-md-6">
      <div class="nutrotion-problem">
        <h4><strong>Evaluation</strong></h4>
        <div class="row">
          <div>
            <input
              type="checkbox"
              formControlName="EleMet"
              (change)="
                onCheckboxChange('EleMet', ['EleNotMet', 'ElePartiallyMet'])
              "
            />
            <label>Met</label>
          </div>
          <div>
            <input
              type="checkbox"
              formControlName="ElePartiallyMet"
              (change)="
                onCheckboxChange('ElePartiallyMet', ['EleMet', 'EleNotMet'])
              "
            />
            <label>Partially Met</label>
          </div>
          <div>
            <input
              type="checkbox"
              formControlName="EleNotMet"
              (change)="
                onCheckboxChange('EleNotMet', ['EleMet', 'ElePartiallyMet'])
              "
            />
            <label>Not Met</label>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="nutrotion-problem">
        <h4><strong>Revision</strong></h4>
        <div class="row">
          <div>
            <input
              type="checkbox"
              formControlName="ElrContinue"
              (change)="
                onCheckboxChange('ElrContinue', ['ElrAchieved', 'ElrEdited'])
              "
            />
            <label>Reviewed and Continue</label>
          </div>
          <div>
            <input
              type="checkbox"
              formControlName="ElrEdited"
              (change)="
                onCheckboxChange('ElrEdited', ['ElrContinue', 'ElrAchieved'])
              "
            />
            <label>Reviewed and Edited</label>
          </div>
          <div>
            <input
              type="checkbox"
              formControlName="ElrAchieved"
              (change)="
                onCheckboxChange('ElrAchieved', ['ElrContinue', 'ElrEdited'])
              "
            />
            <label>Achieved</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
