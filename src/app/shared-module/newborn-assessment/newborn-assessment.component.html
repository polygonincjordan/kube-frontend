<div>
  <form [formGroup]="newBornForm">
    <div class="row m-0 mb-2">
      <div class="col-md-4 row m-0">
        <div class="col-md-6">
          <label>Date</label>
        </div>
        <div class="col-md-6">
            <div class="header-date">
                <span _ngcontent-ufq-c103="" style="position: relative;top: 30px; right: 4px;float: right; margin-top: -26px;font-size: 18px;">
                  <img src="assets/img/Calender.svg" alt="" />
                </span>
                <input formControlName="Datee" class="form-control" style="color: #000; border-radius: 8px" type="text"
                  placeholder="" [minDate]="" [maxDate]="" #dp="bsDatepicker" bsDatepicker [bsConfig]="{
                    showWeekNumbers: false,
                    dateInputFormat: 'DD.MM.YYYY'
                  }" />
              </div>
        </div>
      </div>
      <div class="col-md-4 row m-0"></div>
      <div class="col-md-4 row m-0">
        <div class="col-md-4">
          <label>Time</label>
        </div>
        <div class="col-md-6">
          <input
            type="time"
            step="2"
            class="form-control"
            min="08:00:00"
            max="17:00:00"
            formControlName="Timee"
          />
        </div>
      </div>
    </div>
    <div class="row m-0 mb-2">
      <div class="col-md-4 row m-0">
        <div class="col-md-6">
          <label>Mode of Delivery</label>
        </div>
        <div class="col-md-6">
          <ng-select
            formControlName="ModeDelivery"
            [items]="modeOfDeliveryList"
            bindLabel="label"
            bindValue="value"
          >
          </ng-select>
        </div>
      </div>
      <div class="col-md-4 row m-0">
        <div class="col-md-6">
          <label>Assessment Done</label>
        </div>
        <div class="col-md-6">
          <ng-select formControlName="AssessmentDone">
            <ng-option value="0">Yes</ng-option>
            <ng-option value="1">No</ng-option>
          </ng-select>
        </div>
      </div>
      <div class="col-md-4 row m-0">
        <div class="col-md-4">
          <label>Assessed By</label>
        </div>
        <div class="col-md-8">
          <input class="form-control" formControlName="AssessedBy" />
        </div>
      </div>
    </div>
    <div class="row m-0 mb-2">
      <div class="col-md-4 row m-0"></div>
      <div class="col-md-4 row m-0">
        <div class="col-md-6">
          <label>Date of Birth</label>
        </div>
         <div class="col-md-6">
          <div class="header-date">
            <span _ngcontent-ufq-c103="" style="
                    position: relative;
                    top: 30px;
      right: 4px;
      float: right;
                margin-top: -26px;
                font-size: 18px;
                
              ">
              <img src="assets/img/Calender.svg" alt="" />
            </span>
  
            <input formControlName="BirthDate" class="form-control" style="color: #000; border-radius: 8px" type="text"
              placeholder="" [minDate]="" [maxDate]="" #dp="bsDatepicker" bsDatepicker [bsConfig]="{
                showWeekNumbers: false,
                dateInputFormat: 'DD.MM.YYYY'
              }" />
          </div>
        </div>
      </div>
      <div class="col-md-4 row m-0">
        <div class="col-md-4">
          <label>Time of Birth</label>
        </div>
        <div class="col-md-6">
          <input
            type="time"
            step="2"
            class="form-control"
            min="08:00:00"
            max="17:00:00"
            formControlName="BirthTime"
          />
        </div>
      </div>
    </div>

    <div class="end-container">
      <div class="scale-box-main">
        <label class="box-label">Anthropometric Measurements</label>
        <div class="container-fluid">
          <div class="tab-navigation-part p-0">
            <div class="container-fluid">
              <div class="row m-0 mb-2">
                <div class="col-md-6 row m-0">
                  <div class="col-md-3">
                    <label>Birth Weight</label>
                  </div>
                  <div class="col-md-3">
                    <input class="form-control" formControlName="BirthWeight"   [ngClass]="{'is-invalid': isInvalid('BirthWeight')}"  />
                  </div>
                  <div class="col-md-3">
                    <ng-select
                      formControlName="WeightUnit"
                      [items]="weight"
                      bindLabel="label"
                      bindValue="value"
                    >
                    </ng-select>
                  </div>
                </div>
                <div class="col-md-6 row m-0">
                  <div class="col-md-3">
                    <label>Head Circumference</label>
                  </div>
                  <div class="col-md-3">
                    <input class="form-control" formControlName="HeadCircum"   [ngClass]="{'is-invalid': isInvalid('HeadCircum')}"  />
                  </div>
                  <div class="col-md-3">
                    <label>CM</label>
                  </div>
                </div>
              </div>
              <div class="row m-0 mb-2">
                <div class="col-md-6 row m-0">
                  <div class="col-md-3">
                    <label>Length of the Baby</label>
                  </div>
                  <div class="col-md-3">
                    <input class="form-control" formControlName="BabyLength"   [ngClass]="{'is-invalid': isInvalid('BabyLength')}" />
                  </div>
                  <div class="col-md-3">
                    <label>CM</label>
                  </div>
                </div>
                <div class="col-md-6 row m-0">
                  <div class="col-md-3">
                    <label>Chest Circumference</label>
                  </div>
                  <div class="col-md-3">
                    <input class="form-control" formControlName="ChestCircum"   [ngClass]="{'is-invalid': isInvalid('ChestCircum')}"  />
                  </div>
                  <div class="col-md-3">
                    <label>CM</label>
                  </div>
                </div>
              </div>
              <div class="row m-0 mb-2">
                <div class="col-md-6 row m-0">
                  <div class="col-md-3">
                    <label>Gestation</label>
                  </div>
                  <div class="col-md-3">
                    <input class="form-control" formControlName="Gestation"   [ngClass]="{'is-invalid': isInvalid('Gestation')}" />
                  </div>
                  <div class="col-md-3">
                    <label>Weeks</label>
                  </div>
                </div>
                <div class="col-md-6 row m-0">
                  <div class="col-md-3">
                    <label>Gender</label>
                  </div>
                  <div class="col-md-3">
                    <input class="form-control" formControlName="Gender" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- vital section -->
    <div class="end-container">
      <div class="scale-box-main">
        <label class="box-label">Vitals</label>
        <div class="container-fluid">
          <div class="tab-navigation-part p-0">
            <div class="container-fluid">
              <div class="allergy-box d-flex justify-content-between py-3">
                <div class="allergy-checkbox-section d-flex align-items-center">
                  <input
                    type="checkbox"
                    id="noVitalSignsApplicable"
                    (change)="handleCheckboxVitals($event)"
                    style="width: 24px; height: 20px"
                    [attr.disabled]="toVitalsArr?.length > 0 ? true : null"
                  />
                  <label
                    class="admitting-physician"
                    for="noVitalSignsApplicable"
                    >&nbsp;&nbsp;No Vitals Signs Applicable</label
                  >
                </div>
                <div class="secound-bar-vital-sign" (click)="openModalVital()">
                  <img
                    src="assets/img/file1.svg"
                    title="Create & Import"
                    class="img-size"
                  />
                </div>
              </div>
              <div style="max-height: 296px; overflow: auto">
                <table class="table table-bordered past-table">
                  <thead style="background-color: #e4edf5; color: black">
                    <tr>
                      <th scope="col">Description</th>
                      <th scope="col">Measured Value</th>
                      <th scope="col">Normal Range</th>
                      <th scope="col">Date/Time</th>
                      <th scope="col"></th>
                    </tr>
                  </thead>
                  <tbody style="background-color: #fbfcff">
                    <tr
                      class="past-med-input"
                      *ngFor="let item of toVitalsArr; let i = index"
                    >
                      <td
                        style="
                          padding: 10px !important;
                          width: 15%;
                          pointer-events: none;
                        "
                      >
                        {{ item.Vdescription }}
                      </td>
                      <td
                        style="
                          padding: 10px !important;
                          width: 15%;
                          pointer-events: none;
                        "
                      >
                        {{ item.MeasuredValue }} {{ item.Vunit }}
                      </td>
                      <td
                        style="
                          padding: 10px !important;
                          width: 15%;
                          pointer-events: none;
                        "
                      >
                        {{ item.NormalRange }}
                      </td>
                      <td
                        style="
                          padding: 10px !important;
                          width: 15%;
                          pointer-events: none;
                        "
                      >
                        {{ item.DateTime }}
                      </td>
                      <td
                        style="
                          padding: 10px !important;
                          width: 3%;
                          text-align: center;
                        "
                        (click)="deleteVitalsFromTable(i)"
                      >
                        <img src="assets/img/Delete.svg" />
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="end-container">
      <div class="scale-box-main">
        <label class="box-label">Anthropometric Measurements</label>
        <div class="container-fluid">
          <div class="tab-navigation-part p-0">
            <div class="tab-navigate">
              <div class="tab-nav w-100">
                <ul class="m-0 p-0 d-flex mb-2 tab-ui">
                  <li
                    *ngFor="let tab of tabList"
                    class="d-flex m-0 align-items-center"
                    (click)="assessmentTabSelect(tab)"
                    [ngClass]="selectedTabName == tab ? 'active' : ''"
                  >
                    <img src="./assets/img/grid-icon.svg" />
                    <p class="d-inline-block m-0">{{ tab }}</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div>
            <div *ngIf="selectedTabName === 'Skin'">
              <div class="row m0">
                <div class="col-md-2">
                  <label>Skin Color</label>
                </div>
                <div class="col-md-3">
                  <ng-select
                    formControlName="SSkincolor"
                    [items]="skinColorList"
                    bindLabel="label"
                    bindValue="value"
                  >
                  </ng-select>
                </div>
                <div class="col-md-5">
                  <input class="form-control" formControlName="SSkincolorT" />
                </div>
              </div>
              <div class="row m0">
                <div class="col-md-2">
                  <label>Appearance</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaNormal" />
                  <label class="m-0 ml-2" class="m-0 ml-2">Normal</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaRash" />
                  <label class="m-0 ml-2">Rash / Milia</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaBruising" />
                  <label class="m-0 ml-2">Bruising Abrasions</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaLanugo" />
                  <label class="m-0 ml-2">Lanugo</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaEdema" />
                  <label class="m-0 ml-2">Edema</label>
                </div>
              </div>
              <div class="row m0">
                <div class="col-md-2"></div>
                <div class="col-md-2 row m-0 align-items-center">
                    <input type="checkbox" formControlName="SaDry" />
                    <label class="m-0 ml-2">Dry/Peeling</label>
                  </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaMongolian" />
                  <label class="m-0 ml-2">Mongolian Spot</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaSkinTags" />
                  <label class="m-0 ml-2">Skin Tags</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaPetechia" />
                  <label class="m-0 ml-2">Petechia/ Ecchymosis</label>
                </div>
                <div class="col-md-2 row m-0 align-items-center">
                  <input type="checkbox" formControlName="SaCoatings" />
                  <label class="m-0 ml-2">Coatings (Vernix / Meconium)</label>
                </div>
              </div>
              <div class="row m0 mt-3">
                <div class="col-md-2"></div>
                <div class="col-md-10 text-area-container">
                  <textarea
                    class="form-control"
                    formControlName="SaComments"
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="mt-3" *ngIf="selectedTabName === 'Head & Neck'">
              <!-- Shape -->
              <div class="mb-2 d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label">Shape</label>
                </div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsNormal"
                    />
                    <label class="form-check-label">Normal</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsForceps"
                    />
                    <label class="form-check-label">Forceps Mark</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsMolding"
                    />
                    <label class="form-check-label">Molding Present</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsCaput"
                    />
                    <label class="form-check-label">Caput</label>
                  </div>
                </div>
              </div>

              <div class="mb-3 d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label"></label>
                </div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsLacerations"
                    />
                    <label class="form-check-label"
                      >Lacerations / Bruising</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsOverriding"
                    />
                    <label class="form-check-label">Overriding Sutures</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsCephalhema"
                    />
                    <label class="form-check-label">Cephalhematoma</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HsOther"
                    />
                    <label class="form-check-label">Other</label>
                    <input
                      type="text"
                      class="form-control ms-2 d-inline ml-3"
                      formControlName="HsOtherT"
                    />
                  </div>
                </div>
              </div>

              <!-- Fontanels -->
              <div class="mb-2 mt- d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label">Fontanels</label>
                </div>
                <div class="col-11">
                  <div class="checkbox-group">
                    <div>
                      <div class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          formControlName="HfAnterior"
                        />
                        <label class="form-check-label">Posterior</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="radio"
                          formControlName="HfAnteriorOc"
                          value="0"
                          (click)="toggleRadio('HfAnteriorOc', '0')"
                        />
                        <label class="form-check-label">Open</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="radio"
                          formControlName="HfAnteriorOc"
                          value="1"
                          (click)="toggleRadio('HfAnteriorOc', '1')"
                        />
                        <label class="form-check-label">Closed</label>
                        <input
                          class="form-control ms-2 d-inline ml-3"
                          type="text"
                          formControlName="HfAother"
                        />
                      </div>
                      <div class="form-check form-check-inline">
                        <label class="form-check-label" for="hypotonic"
                          >Size</label
                        >
                        <input
                          class="form-control ms-2 d-inline ml-3"
                          type="text"
                          formControlName="HfAsize"
                        />
                      </div>
                    </div>
                    <div class="mt-4">
                      <div class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          formControlName="HfPosterior"
                        />
                        <label class="form-check-label">Posterior</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="radio"
                          formControlName="HfPosteriorOc"
                          value="0"
                          (click)="toggleRadio('HfPosteriorOc', '0')"
                        />
                        <label class="form-check-label">Open</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="radio"
                          formControlName="HfPosteriorOc"
                          value="1"
                          (click)="toggleRadio('HfPosteriorOc', '1')"
                        />
                        <label class="form-check-label">Closed</label>
                        <input
                          class="form-control ms-2 d-inline ml-3"
                          type="text"
                          formControlName="HfPother"
                        />
                      </div>
                      <div class="form-check form-check-inline">
                        <label class="form-check-label" for="hypotonic"
                          >Size</label
                        >
                        <input
                          class="form-control ms-2 d-inline ml-3"
                          type="text"
                          formControlName="HfPsize"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Ears -->
              <div class="mb-3 d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label">Ears</label>
                </div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeNormal"
                    />
                    <label class="form-check-label">Normal</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeLowSet"
                    />
                    <label class="form-check-label">Low set</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HePreauricular"
                    />
                    <label class="form-check-label"> Pre-auricular tags</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeBleeding"
                    />
                    <label class="form-check-label"
                      >Bleeding / discharges</label
                    >
                  </div>
                </div>
              </div>
              <div class="mb-3 d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label"></label>
                </div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeOther"
                    />
                    <label class="form-check-label">Other</label>
                    <input
                      type="text"
                      class="form-control ms-2 d-inline ml-3"
                      style="width: 200px"
                      formControlName="HeOtherT"
                    />
                  </div>
                </div>
              </div>

              <!-- Eyes -->
              <div class="mb-3 d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label">Eyes</label>
                </div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeyClear"
                    />
                    <label class="form-check-label">Clear</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeyScleral"
                    />
                    <label class="form-check-label">Scleral hemorrhage</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeyEdema"
                    />
                    <label class="form-check-label">Edema of eyelids</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeyConjunct"
                    />
                    <label class="form-check-label"> Red Reflex</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeyRed"
                    />
                    <label class="form-check-label"> Red Reflex</label>
                  </div>
                </div>
              </div>
              <div class="d-flex align-items-center">
                <div class="col-1"></div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HeyOther"
                    />
                    <label class="form-check-label">Other</label>
                    <input
                      type="text"
                      class="form-control ms-2 d-inline ml-3"
                      style="width: 200px"
                      formControlName="HeyOtherT"
                    />
                  </div>
                </div>
              </div>
              <!-- Nose -->
              <div class="mb-3 d-flex align-items-center">
                <div class="col-1">
                  <label class="form-label">Nose</label>
                </div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HnNostrils"
                    />
                    <label class="form-check-label"> Patent nostrils</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HnClosed"
                    />
                    <label class="form-check-label">Closed</label>
                  </div>
                </div>
              </div>
              <div class="d-flex align-items-center">
                <div class="col-1"></div>
                <div class="col-11">
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="HnOther"
                    />
                    <label class="form-check-label">Other</label>
                    <input
                      type="text"
                      class="form-control ms-2 d-inline ml-3"
                      style="width: 200px"
                      formControlName="HnOtherT"
                    />
                  </div>
