<div class="ventilator-shell">
  <div class="ventilator-shell__panel">
    <div class="ventilator-shell__header">
      <div>
        <div class="ventilator-shell__title-row">
          <h3>IC Bundle for Adult Ventilator Associated Pneumonia (A-VAP)</h3>
          <span class="under-development-badge">Under Development</span>
        </div>
        <p class="ventilator-shell__subtitle">This document is not available for data entry yet.</p>
      </div>
    </div>

    <div class="ventilator-shell__body">
      <div class="ventilator-shell__status">
        <span class="ventilator-shell__status-label">Status</span>
        <span class="ventilator-shell__status-value">UI shell only</span>
      </div>
    </div>

    <div class="ventilator-shell__actions">
      <button type="button" class="ventilator-shell__cancel" (click)="onCancel()">Cancel</button>
    </div>
  </div>
</div>
