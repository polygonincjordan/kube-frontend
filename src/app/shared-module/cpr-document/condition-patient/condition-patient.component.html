<form [formGroup]="cprForm">
    <div>
        <div class="row mt-3">
            <div class="col-md-3 row m-0">
                <div class="col-md-5 mr-3">
                    <label class="m-0">Unresponsive</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="Unresponsive">
                        <ng-option *ngFor="let value of unResponseList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Breathing</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="Breathing">
                        <ng-option *ngFor="let value of unResponseList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-5">
                    <label class="m-0">Pulse present</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="PulsePresent">
                        <ng-option *ngFor="let value of unResponseList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Cyanotic</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="Cyanotic">
                        <ng-option *ngFor="let value of ettArrestList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <!-- <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Cyanotic</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="TeamLeaderTm">
                        <ng-option></ng-option>
                    </ng-select>
                </div>
            </div> -->
            <div class="col-md-3 row m-0">
                <div class="col-md-5 mr-3">
                    <label class="m-0">Pupils dilated</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="PupilsDilated">
                        <ng-option *ngFor="let value of unResponseList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Seizure</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="Seizure">
                        <ng-option *ngFor="let value of unResponseList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-5">
                    <label class="m-0">History of Seizures</label>
                </div>
                <div class="col-md-6">
                    <ng-select formControlName="HistorySeizures">
                        <ng-option *ngFor="let value of unResponseList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Chest Compression</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="ChestCompression" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-8 row m-0">
                <div class="col-md-2">
                    <label class="m-0">Note</label>
                </div>
                <div class="col-md-10">
                    <input type="text" class="form-control" formControlName="Note">
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-3 row m-0">
                <div class="col-md-5 mr-3">
                    <label class="m-0">Leads in place</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="LeadsPlace" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Monitor active</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="MonitorActive" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Cannula 1</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="Cannula1" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Cunnala 2</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="Cannula2" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-3 row m-0">
                <div class="col-md-5 mr-3">
                    <label class="m-0">Infusion 1</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="Infusion1" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Infusion 2</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="Infusion2" class="form-control" min="08:00:00"
                        max="17:00:00" />
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-8 row m-0">
                <div class="col-md-2">
                    <label class="m-0">Note</label>
                </div>
                <div class="col-md-10">
                    <input type="text" class="form-control" formControlName="Note1">
                </div>
            </div>
        </div>

        <div class="mt-3 p-2" style="border: 1px solid #cacaca; ">
            <h4 class="table-line">Lines</h4>
            <div class="row mt-2">
                <div class="col-md-3 row m-0">
                    <div class="col-md-4">
                        <label class="m-0">Sites</label>
                    </div>
                    <div class="col-md-8">
                        <ng-select formControlName="LSites">
                            <ng-option *ngFor="let value of sitesList" [value]="value.value">{{ value.label
                                }}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-3 row m-0">
                    <div class="col-md-4">
                        <label class="m-0"># of Attempts</label>
                    </div>
                    <div class="col-md-4">
                        <input class="form-control" formControlName="LAttempts">
                    </div>
                </div>
                <div class="col-md-3 row m-0">
                    <div class="col-md-2">
                        <label class="m-0">Type</label>
                    </div>
                    <div class="col-md-8">
                        <input class="form-control" formControlName="LType">
                    </div>
                </div>
                <div class="col-md-3 row m-0">
                    <div class="col-md-2">
                        <label class="m-0">Size</label>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" formControlName="LSize">
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3 p-2" style="border: 1px solid #cacaca; ">
            <h4 class="mb-2 ml-2 table-line">Ventilation</h4>
            <div class="row">
                <div class="col-md-4 row m-0">
                    <div class="col-md-5">
                        <label class="m-0">Ventilation by</label>
                    </div>
                    <div class="col-md-3">
                        <ng-select formControlName="VentilationBy">
                            <ng-option *ngFor="let value of VentilationList" [value]="value.value">{{ value.label
                                }}</ng-option>

                        </ng-select>
                    </div>
                    <div class="col-md-4">
                        <input class="form-control" formControlName="VentilationTxt">
                    </div>
                </div>
                <div class="col-md-4">

                </div>

                <div class="col-md-4 row m-0">
                    <div class="col-md-3">
                        <label class="m-0">Ventilation</label>
                    </div>
                    <div class="col-md-5">
                        <input type="time" step="2" formControlName="Ventilation" class="form-control"
                            min="08:00:00" max="17:00:00" />
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-4 row m-0">
                    <div class="col-md-5">
                        <label class="m-0">Intubation</label>
                    </div>
                    <div class="col-md-4">
                        <input type="time" step="2" formControlName="Intubation" class="form-control" min="08:00:00" max="17:00:00" />
                    </div>
                </div>
                <div class="col-md-4 row m-0">

                </div>
                <div class="col-md-4 row m-0">
                    <div class="col-md-3">
                        <label class="m-0">FIO2 %</label>
                    </div>
                    <div class="col-md-5">
                        <input class="form-control" formControlName="Fio2">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-4 row m-0">
                    <div class="col-md-5">
                        <label class="m-0">ETT placed at time of arrest</label>
                    </div>
                    <div class="col-md-4">
                        <ng-select formControlName="EttPlaced">
                            <ng-option *ngFor="let value of ettArrestList" [value]="value.value">{{ value.label
                                }}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-4 row m-0">
                    <div class="col-md-3">
                        <label class="m-0">ETT Size</label>
                    </div>
                    <div class="col-md-3">
                        <input class="form-control" formControlName="EttSize">
                    </div>
                </div>
                <div class="col-md-4 row m-0">
                    <div class="col-md-3">
                        <label class="m-0">ETT Depth </label>
                    </div>
                    <div class="col-md-5">
                        <input class="form-control" formControlName="EttDepth">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6 row m-0">
                    <div class="col-md-3 mr-4">
                        <label class="m-0">If no, ETT is placed</label>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" formControlName="EttIsPlaced">
                    </div>
                </div>
                <div class="col-md-6 row m-0">
                    <div class="col-md-2">
                        <label class="m-0">ETT placed by</label>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" formControlName="EttIsPlacedBy">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-4 row m-0">
                    <div class="col-md-5">
                        <label class="m-0">Tooth Damage with Intubation</label>
                    </div>
                    <div class="col-md-4">
                        <ng-select formControlName="ToothDamage">
                            <ng-option *ngFor="let value of ettArrestList" [value]="value.value">{{ value.label
                                }}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-4 row m-0">
                    <div class="col-md-3">
                        <label class="m-0">Bleeding</label>
                    </div>
                    <div class="col-md-4">
                        <ng-select formControlName="Bleeding">
                            <ng-option *ngFor="let value of ettArrestList" [value]="value.value">{{ value.label
                                }}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-4 row m-0">
                    <div class="col-md-3">
                        <label class="m-0">Vomiting </label>
                    </div>
                    <div class="col-md-5">
                        <ng-select formControlName="Vomiting">
                            <ng-option *ngFor="let value of ettArrestList" [value]="value.value">{{ value.label
                                }}</ng-option>
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
