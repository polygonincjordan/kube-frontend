<form [formGroup]="cprForm">
    <div class="mt-3 p-2" style="border: 1px solid #cacaca; ">
        <h4 class="mb-2 ml-2 table-line">Code Outcome</h4>
        <div class="row">
            <div class="col-md-3 row m-0">
                <div class="col-md-6">
                    <label class="m-0">Time code Terminated</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="Terminated" class="form-control" min="08:00:00" max="17:00:00" />
                </div>
            </div>
            <div class="col-md-4 row m-0">
                <div class="col-md-6">
                    <label class="m-0">Disposition / Following Code</label>
                </div>
                <div class="col-md-5">
                    <ng-select formControlName="Disposition">
                        <ng-option *ngFor="let value of dispositionCodeList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Tranferred To</label>
                </div>
                <div class="col-md-5">
                    <input class="form-control" formControlName="Transferred">
                </div>
            </div>
            <div class="col-md-2 row m-0">
                <div class="col-md-3">
                    <label class="m-0">Time</label>
                </div>
                <div class="col-md-7">
                    <input type="time" step="2" formControlName="TransferredTm" class="form-control" min="08:00:00" max="17:00:00" />
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-3 row m-0">
                <div class="col-md-6">
                    <label class="m-0">Declared expired by</label>
                </div>
                <div class="col-md-6">
                    <input type="time" step="2" formControlName="DeclaredExpired" class="form-control" min="08:00:00" max="17:00:00" />
                </div>
            </div>
            <div class="col-md-4 row m-0"></div>
            <div class="col-md-3 row m-0"></div>
            <div class="col-md-2 row m-0">
                <div class="col-md-3">
                    <label class="m-0">Time</label>
                </div>
                <div class="col-md-7">
                    <input type="time" step="2" formControlName="DeclaredExpiredTm" class="form-control" min="08:00:00" max="17:00:00" />
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-5 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Autopsy Forensic Medicine</label>
                </div>
                <div class="col-md-8">
                    <input class="form-control" formControlName="Autopsy">
                </div>
            </div>
            <div class="col-md-3 row m-0">
                <div class="col-md-4">
                    <label class="m-0">Family Informed</label>
                </div>
                <div class="col-md-5">
                    <ng-select formControlName="FamilyInformed">
                        <ng-option *ngFor="let value of ettArrestList" [value]="value.value">{{ value.label
                            }}</ng-option>
                    </ng-select>
                </div>
            </div>
            <div class="col-md-2 row m-0">
                <div class="col-md-3">
                    <label class="m-0">Date</label>
                </div>
                <div class="col-md-8">
                    <div class="date-function">
                        <img src="assets/img/Calender.svg" alt="">
                        <input formControlName="FDate" class="form-control" style="color: #000; border-radius: 8px" type="text"
                          placeholder="" [minDate]="" [maxDate]="" #dp="bsDatepicker" bsDatepicker [bsConfig]="{ showWeekNumbers: false,
                          dateInputFormat: 'DD.MM.YYYY' }" />
                    </div>
                </div>
            </div>
            <div class="col-md-2 row m-0">
                <div class="col-md-3">
                    <label class="m-0">Time</label>
                </div>
                <div class="col-md-7">
                    <input type="time" step="2" formControlName="FTime" class="form-control" min="08:00:00" max="17:00:00" />
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-12 row m-0">
                <div class="col-md-3">
                    <label class="m-0">Name of Physician for MRP who informed family</label>
                </div>
                <div class="col-md-6">
                    <input class="form-control" formControlName="NamePhysician">
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-5 row m-0">
                <div class="col-md-4">
                    <label class="m-0">ECG Strip attached</label>
                </div>
                <div class="col-md-6">
                    <input class="form-control" formControlName="EcgStrip">
                </div>
            </div>
            <div class="col-md-6 row m-0">
                <div class="col-md-2">
                    <label class="m-0">Attached By</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="AttachedBy">
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4 row m-0">
                <div class="col-md-5">
                    <label class="m-0">Witnessed By</label>
                </div>
                <div class="col-md-7">
                    <input class="form-control" formControlName="WitnessedBy">
                </div>
            </div>
        </div>
    </div>
</form>
