<form [formGroup]="nursingAdmissionForm">
  <div class="end-container">
    <div class="sph-box">
      <label class="box-label">Physical Assessment (Review of Systems)</label>
      <div class="container-fluid">
        <div class="row m-0 mb-4 ml-3">
          <input type="checkbox" (change)="disabledAllValue()" />
          <label class="m-0">Cannot be Assessed</label>
        </div>
        <div class="tab-navigation-part">
          <div class="tab-navigate">
            <div class="tab-nav w-100">
              <ul class="m-0 p-0 d-flex mb-2 tab-ui">
                <li *ngFor="let tab of tabList" class="d-flex m-0 align-items-center" (click)="assessmentTabSelect(tab)"
                  [ngClass]="selectedTabName == tab ? 'active' : ''">
                  <img src="./assets/img/grid-icon.svg" />
                  <p class="d-inline-block m-0">{{ tab }}</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="tab-content pl-2 mb-3" style="border-radius: 7px">
            <div *ngIf="selectedTabName == 'Skin'">
              <div class="row m-0">
                <div class="col-md-12 row m-0">
                  <div class="col-md-4">
                    <input type="checkbox" formControlName="SNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">No reported abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-4">
                    <input type="checkbox" formControlName="SRashes" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Rashes</label>
                  </div>
                  <div class="col-md-4 row m-0">
                    <label class="m-0">Type of Rash</label>
                    <ng-select [items]="typeOfRash" bindLabel="label" bindValue="value"   formControlName="STypeRash" class="w-40 ml-2" [readonly]="isDisabled()"></ng-select>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-4">
                    <input type="checkbox" formControlName="SItching" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Itching</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-4">
                    <input type="checkbox" formControlName="SChangeHairNails" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Change in hair or nails</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0 mt-3">
                  <div class="col-md-8 d-flex">
                    <label class="m-0">Comments</label>
                    <input class="form-control w-70 ml-3" [disabled]="isDisabled()" formControlName="SComments"/>
                  </div>
                </div>
              </div>
            </div>
            <div *ngIf="selectedTabName == 'Head'">
              <div class="row m-0">
                <div class="col-md-12 row m-0">
                  <div class="col-md-4">
                    <input type="checkbox" formControlName="HNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">No reported abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-4">
                    <input type="checkbox" formControlName="HHeadInjury" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Head Injury</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0 mt-3">
                  <div class="col-md-4 d-flex">
                    <label class="m-0" style="white-space: nowrap;">Head Circumference (cm)</label>
                    <input class="form-control ml-3 w-70" formControlName="HHeadCircumference" [disabled]="isDisabled()"/>
                  </div>
                </div>
              </div>
            </div>
            <div *ngIf="selectedTabName == 'Eyes'">
              <div class="row tab-content scale-box mt-3 m-0" style="border-radius: 7px">
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="ENoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">No reported abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" formControlName="EGlassesContacts" class="m-0" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Glasses or contacts</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="EChangeVision" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Change in vision</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="EEyePain" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Eye pain</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="EDoubleVision" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Double vision</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="EFlashingLights" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Flashing lights</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="EGlaucomaCataracts" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Glaucoma/Cataracts</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="ELastEyeExam" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Last Eye exam </label>
                  </div>
                </div>
                <div class="col-md-12 row m-0 ml-2 mt-3">
                  <label class="m-0 mr-3">Comments</label>
                  <input class="form-control w-70" [disabled]="isDisabled()" formControlName="EComments"/>
                </div>
              </div>
            </div>
            <div *ngIf="selectedTabName == 'ENT'">
              <div class="row m-0 mb-3">
                <div class="col-md-2 row m-0">
                  <div class="col-md-2">
                    <label class="m-0">EARS</label>
                  </div>
                </div>
                <div class="col-md-10 row m-0">
                  <div class="col-md-12">
                    <input type="checkbox" formControlName="EneNoReportedAbnorma" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">No reported abnormalities</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EneChangeHearing"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Change in hearing</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EneTympanicMembrane"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Tymapanic Membrane</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EneEarDischarge"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Ear discharge</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EneRinging"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Ringing</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EneDizziness"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Dizziness</label>
                  </div>
                </div>
              </div>
              <div class="row m-0 mb-3">
                <div class="col-md-2 m-0 row">
                  <div class="col-md-2">
                    <label class="m-0">NOSE/SINUSES</label>
                  </div>
                </div>
                <div class="col-md-10 row m-0">
                  <div class="col-md-12">
                    <input type="checkbox" formControlName="EnnNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">No reported abnormalities</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EnnNoseBleeds"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Nose bleeds</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EnnNasalStuffiness"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Nasal stuffiness</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EnnNasalFlaring"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Nasal Flaring</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EnnFrequentColds"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Frequent colds</label>
                  </div>
                </div>
              </div>
              <div class="row m-0 mb-3">
                <div class="col-md-2 row m-0">
                  <div class="col-md-2">
                    <label class="m-0">MOUTH/THROAT</label>
                  </div>
                </div>
                <div class="col-md-10 row m-0">
                  <div class="col-md-12">
                    <input type="checkbox" formControlName="EnmNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null"/>
                    <label class="m-0">No reported abnormalities</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EnmBleedingGums"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Bleeding gums</label>
                  </div>
                  <div class="col-md-2 d-flex">
                    <input type="checkbox" formControlName="EnmSoreTongue"
                      [attr.disabled]="isDisabled() ? true : null" />
                    <label class="m-0">Sore tongue</label>
                  </div>
                  <div class="col-md-3 d-flex">
                    <label class="m-0 w-30">Lip Color</label>
                    <input class="form-control ml-3" formControlName="EnmLipColor" [disabled]="isDisabled()"/>
                  </div>
                </div>
              </div>
            </div>
            <div *ngIf="selectedTabName == 'Neck'">
              <div class="row tab-content scale-box mt-3 m-0" style="border-radius: 7px">
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0"formControlName="NNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">No reported abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" formControlName="NLumps" class="m-0" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Lumps</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="NSwollenGlands" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Swollen Glands</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="NGoiter" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Goiter</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="NStiffness" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Stiffiness</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0 mt-3 ml-2">
                  <label class="m-0 mr-2">Comments</label>
                  <input class="form-control w-70" [disabled]="isDisabled()" formControlName="NComments"/>
                </div>
              </div>
            </div>
            <div *ngIf="selectedTabName == 'Breast'">
              <div class="row tab-content scale-box mt-3 m-0" style="border-radius: 7px">
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="BNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">No reported abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="BLumps" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Lumps</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="BPain" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Pain</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="BNippleDischarge" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Nipple discharge</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="BSkinAbnormalities" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Skin Abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0 mt-3 ml-2">
                  <label class="m-0 mr-2">Comments</label>
                  <input class="form-control w-70" [disabled]="isDisabled()" formControlName="BComments"/>
                </div>
              </div>
            </div>
            <div *ngIf="selectedTabName == 'Respiratory/Cardiac'">
              <div class="row tab-content scale-box mt-3 m-0" style="border-radius: 7px">
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">No reported abnormalities</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0">
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RShortnessBreath" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Shotness of breath</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RCough" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Cough</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RWheezing" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Wheezing</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RCoughingBlood" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Coughing up blood</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RProductionPhlegm" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Production of phlegm, color</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RChestPain" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Chest pain</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RNightSweats" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Night sweats</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RBlueFingersToes" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Blue fingers/toes</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RSwellingHandsFeet" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Swelling in hands/feet</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RBronchitisEmphysema" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Bronchitis/Emphysema</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RHeartMurmur" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Heart muemur</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RHxHeartMedication" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">HX of heart medication</label>
                  </div>
                  <div class="col-md-2 row m-0">
                    <input type="checkbox" class="m-0" formControlName="RSkippingHeartBeats" [attr.disabled]="isDisabled() ? true : null" />
                    <label class="ml-2 m-0">Skipping heart beats</label>
                  </div>
                </div>
                <div class="col-md-12 row m-0 mt-3 ml-2">
                  <label class="m-0 mr-2">Comments</label>
                  <input class="form-control w-70" [disabled]="isDisabled()" formControlName="RComments"/>
                </div>
              </div>
            </div>
<div *ngIf="selectedTabName == 'Gestrointestinal'">
  <div class="row m-0 mb-2">
    <div class="col-md-12 row m-0">
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GNoReportedAbnorm" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">No reported abnormalities</label>
      </div>
    </div>
    <div class="col-md-12 row m-0">
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GChangeAppetiteWeight" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Change in appetite or weight</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GProblemsSwallowing" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Problems swallowing</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GNausea" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Nausea</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GHeartburn" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Heartburn</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GVomiting" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Vomiting</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GVomitingBlood" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Vomiting blood</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GConstipation" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Constipation</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GDiarrhea" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Diarrhea</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GChangeBowelHabits" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Change in bowel habits</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GAbdominalPain" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Abdominal pain</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GExcessiveBelching" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Excessive belching</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GExcessiveFlatus" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Excessive flatus</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GFoodIntolerance" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Food intolerance</label>
      </div>
      <div class="col-md-2 row m-0">
        <input type="checkbox" class="m-0" formControlName="GRectalBleedingHemo" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Rectal bleeding/Hemarrhoids</label>
      </div>
      <div class="col-md-3 row m-0">
        <input type="checkbox" class="m-0" formControlName="GYellowColourSkin" [attr.disabled]="isDisabled() ? true : null" />
        <label class="ml-2 m-0">Yellow colour of skin(jaundice/hepatitis)</label>
      </div>
    </div>
    <div class="col-md-12 row m-0 mt-3">
      <div class="col-md-2 row m-0">
        <label class="ml-2 m-0">ELIMINATION</label>
      </div>
      <div class="col-md-10 row m-0">
        <div class="col-md-12 row m-0 p-0">
          <div class="col-md-2 row m-0 p-0">
            <input type="checkbox" class="m-0" formControlName="GToiletTrained" [attr.disabled]="isDisabled() ? true : null" />
            <label class="ml-2 m-0">Toilet Trained</label>
          </div>
          <div class="col-md-2 row m-0">
            <label class="m-0">Freq.</label>
            <input type="text" class="form-control m-0 w-60 ml-2" formControlName="GTfreq" />
          </div>
        </div>
        <div class="col-md-12 row m-0 p-0">
          <div class="col-md-2 row m-0 p-0">
            <input type="checkbox" class="m-0" formControlName="GUsesDiaper" [attr.disabled]="isDisabled() ? true : null" />
            <label class="ml-2 m-0">Uses Diaper</label>
          </div>
          <div class="col-md-2 row m-0">
            <label class="m-0">Freq.</label>
            <input type="text" class="form-control m-0 w-60 ml-2" formControlName="GUfreq" [disabled]="isDisabled()" />
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-12 row m-0 mt-3 ml-2">
      <label class="m-0 mr-2">Comments</label>
      <input class="form-control w-70" formControlName="GComments" />
    </div>
  </div>
</div>

            <div *ngIf="selectedTabName == 'Urinary'">
