<div class="container-fluid" style="padding: 10px;">
  <div class="phyacian-list">
    <app-physician-order-list (reloadPhyOrderTable)="reloadTable($event)"
      [physicianOrderList]="physicianOrderList | filter : searchString"
    ></app-physician-order-list>
  </div>
</div>

<ng-template #phyordertemplate>
  <div class="modal-body p-3">
    <form [formGroup]="phyOrderform1" class="order-pop-template">
      <div class="order-form d-flex">
        <div style="width: 35px"></div>
        <div class="order-form-thead order-occupational">
          Occupational Group
        </div>
        <div class="order-form-thead w-50 d-flex justify-content-center align-items-center">Physician Order</div>
        <div class="ml-5">
          <img
            (click)="saveBtnOnModal()"
            src="assets/img/texteditor.png"
            style="width: 30px; height: 30px"
            class="cursor-pointer"
          />
        </div>
      </div>
      <div
        class="order-form d-flex mt-2 mb-2"
        *ngFor="let order of orderTemplateDataSetModal"
      >
        <input
          type="checkbox"
          (click)="addRemoveOrder(order)"
          style="width: 20px; margin-right: 17px"
        />
        <input
          type="text"
          class="form-control"
          disabled
          style="width: 35%; margin-right: 5px"
          [value]="order.ProfGroupText"
        />
        <input
          type="text"
          class="form-control w-50"
          [value]="order.ZphysOrder"
          disabled
        />
      </div>
    </form>
  </div>
</ng-template>

<ng-template #saveTemplate>
  <div class="modal-body p-3">
    <form [formGroup]="saveTemplateForm1" class="order-pop-template">
      <div class="order-form d-flex mt-2 mb-2">
        <input
          name="Templatetxt"
          formControlName="Templatetxt"
          placeholder="Template Name"
          type="text"
          class="form-control"
          style="margin-right: 5px"
        />
        <select
          name="Templatelevel"
          formControlName="Templatelevel"
          class="form-control"
        >
          <option value="2">User Level</option>
          <option value="1">Global Level</option>
        </select>
      </div>
      <div class="text-right mt-3">
        <button
          type="button"
          class="create-progress"
          (click)="saveOrderTemplateData()"
          style="
            border: 1px solid;
            background: #3b82f6;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 700;
          "
        >
          Save Template
        </button>
      </div>
    </form>
  </div>
</ng-template>
