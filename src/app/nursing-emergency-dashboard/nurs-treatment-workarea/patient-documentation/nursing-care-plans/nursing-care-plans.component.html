<div class="tab-navigation-part">
  <div class="tab-navigate">
    <div class="tab-nav">
      <ul class="m-0 p-0 d-flex mb-2 tab-ui">
        <li
          class="d-flex m-0 align-items-center"
          *ngFor="let label of tabLabelList"
          [ngClass]="selectedTabName == label ? 'active' : ''"
          (click)="switchTabs(label)"
        >
          <p class="d-inline-block m-0 input-lable">
            {{ label }}
          </p>
        </li>
      </ul>
    </div>
    <div class="tab-contant">
      <div class="nutrition" *ngIf="selectedTabName == tabLabelList[0]">
        <div class="nur-problem-details row">

            <div class="nutrotion-problem">
              <h4><strong>Problem</strong></h4>
              <div class="row">
                <div class="col-md-8">
                  <input type="checkbox" />

                    <input type="checkbox" />

                  </div>
                  <div>
                    <input type="checkbox" />
                    <label>Potential</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="nutrotion-problem">
              <h4><strong>Goals</strong></h4>
              <div class="">
                <div>
                  <input type="checkbox" />

                </div>
                <div>
                  <input type="checkbox" />

                </div>
                <div>
                  <input type="checkbox" />
                  <label>Promote and Optimize Oral Intake</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label class="mr-3">Others: </label>
                  <input type="text" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="nur-interventions-details mt-3">
          <div class="nutrotion-problem">
            <h4><strong>Interventions</strong></h4>
            <div class="row">
              <div class="col-md-4">
                <div>
                  <input type="checkbox" />
                  <label>Nutritional Counseling</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label>Monitor Intake and Output</label>
                </div>
                <div>
                  <input type="checkbox" />

                </div>
                <div>
                  <input type="checkbox" />

              </div>
              <div class="col-md-4">
                <div>
                  <input type="checkbox" />

                </div>
                <div>

                </div>
                <div>

                </div>
                <div>

                </div>
              </div>
              <div class="col-md-4">
                <div>
                  <input type="checkbox" />
                  <label>Provide Skin Care</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label>Swallowing Therapy</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label class="mr-3">Others: </label>
                  <input type="text" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="nur-problem-details row mt-3">
          <div class="col-md-6">
            <div class="nutrotion-problem">
              <h4><strong>Evaluation</strong></h4>
              <div class="row">
                <div>
                  <input type="checkbox" />
                  <label>Met</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label>Partially Met</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label>Not Met</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="nutrotion-problem">
              <h4><strong>Revision</strong></h4>
              <div class="row">
                <div>
                  <input type="checkbox" />
                  <label>Reviewed and Continue</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label>Reviewed and Edited</label>
                </div>
                <div>
                  <input type="checkbox" />
                  <label>Achieved</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
