<form action="" [formGroup]="inPatientPhdisDataSet">
  <div class="row dg-in-patient-panel">
    <div class="col-md-6">
      <div class="d-flex align-items-center mb-2">
        <div class="col-md-3 pl-0">
          <label for="reason-for-admission" class="col-form-label"
            >Reason for Admission</label
          >
        </div>
        <div class="col-md-9 p-0">
          <textarea
            type="text"
            class="form-control"
            formControlName="AdmissionReason"
            id="reason-for-admission"
          ></textarea>
        </div>
      </div>
      <div class="d-flex align-items-center mb-2">
        <div class="col-md-3 pl-0">
          <label for="summary-for-evolution" class="col-form-label"
            >Summary for Evolution</label
          >
        </div>
        <div class="col-md-9 p-0">
          <textarea
            type="text"
            class="form-control"
            id="summary-for-evolution"
            formControlName="EvolutionSummary"
          ></textarea>
        </div>
      </div>
      <div class="d-flex align-items-center mb-2">
        <div class="col-md-3 pl-0">
          <label for="relevant-results-during-admission" class="col-form-label"
            >Relevant results during Admission</label
          >
        </div>
        <div class="col-md-9 p-0">
          <textarea
            type="text"
            class="form-control"
            formControlName="RelevantResultsAdm"
            id="relevant-results-during-admission"
          ></textarea>
        </div>
      </div>
      <div class="d-flex align-items-center mb-2">
        <div class="col-md-3 pl-0">
          <label for="physical-examination" class="col-form-label"
            >Physical examination at Discharge</label
          >
        </div>
        <div class="col-md-9 p-0">
          <textarea
            type="text"
            class="form-control"
            id="physical-examination"
            formControlName="PhysicalExaminationDischarge"
          ></textarea>
        </div>
      </div>
      <!-- <div class="border-between w-100 mt-3"></div> -->
      <div class="surgery-team-table">
        <div
          class="openPopup-btn d-flex w-60 py-1 my-1 align-items-center in-patient-title mb-2"
        >
          <img width="30" src="assets/img/info-document.png" />
          <span class="ml-2">Treatment and therapeutic intervensions</span>
        </div>
        <div class="d-flex align-items-center mb-2">
          <div class="col-md-3 pl-0">
            <label for="pre-operative" class="col-form-label"
              >Management and treatment plan</label
            >
          </div>
          <div class="col-md-9 p-0">
            <textarea
              type="text"
              class="form-control"
              formControlName="MgmtTreatmentPlan"
              id="pre-operative"
            ></textarea>
          </div>
        </div>
        <div class="d-flex align-items-center mb-2">
          <div class="col-md-3 pl-0">
            <label for="pre-operative" class="col-form-label"
              >Management recommendations</label
            >
          </div>
          <div class="col-md-9 p-0">
            <textarea
              type="text"
              class="form-control"
              formControlName="MgmtRecommendations"
              id="pre-operative"
            ></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="discharge-panel">
        <div
          class="openPopup-btn d-flex w-60 py-1 align-items-center in-patient-title mb-2"
        >
          <img width="30" src="assets/img/info-document.png" />
          <span class="ml-2">Discharge Data</span>
        </div>
        <div class="d-flex flex-wrap align-items-center mb-2">
          <div class="col-md-3 pl-0 mb-2">
            <label for="surgery-date" class="col-form-label"
              >Discharge Date / Discharge Time</label
            >
          </div>
          <div class="col-md-9 pl-0 mb-2 d-flex">
            <div class="col-md-6 pl-0">
              <input
                #drp="bsDatepicker"
                bsDatepicker
                [bsConfig]="{
                  dateInputFormat: 'DD.MM.YYYY',
                  showWeekNumbers: false
                }"
                class="form-control height-normal"
                formControlName="Date"
              />
            </div>
            <div class="col-md-6 pl-0">
              <input
                type="time"
                step="2"
                class="form-control height-normal"
                min="08:00:00" max="17:00:00"
                id="surgery-time"
                formControlName="Time"
              />
            </div>
          </div>
        </div>
        <div class="d-flex flex-wrap align-items-center mb-2">
          <div class="col-md-3 pl-0 mb-2">
            <label for="surgery-date" class="col-form-label"
              >Discharge disposition</label
            >
          </div>
          <div class="col-md-5 pl-0 mb-2">
            <ng-select
              [searchable]="true"
              class="form-control p-0"
              formControlName="DischargeDisposition"
              (change)="onChangeOtherOption(inPatientPhdisDataSet.value)"
            >
              <ng-option
                *ngFor="let item of dischargeDispositionList"
                [value]="item.Value"
                >{{ item.Desc }}</ng-option
              >
            </ng-select>
          </div>
          <div class="col-md-4 p-0 mb-2">
            <input
              type="text"
              class="form-control height-normal"
              id="dischargedisposition"
              formControlName="DischargeDispositionOthers"
              [readonly]="isDisabledOther"
            />
          </div>
          <div class="col-md-3 pl-0">
            <label for="surgery-time" class="col-form-label"
              >Needs transport</label
            >
          </div>
          <div class="col-md-5 pl-0">
            <ng-select
              [searchable]="true"
              class="form-control p-0"
              formControlName="NeedsTransport"
            >
              <ng-option
                *ngFor="let item of NeedTransport"
                [value]="item.Value"
                >{{ item.Desc }}</ng-option
              >
            </ng-select>
          </div>
          <!-- <div class="col-md-5 pl-0 mb-2">
                  <ng-select [searchable]="true" class="form-control p-0"
                     (change)="onChangeOtherOption(4)">
                    <ng-option *ngFor="let item of dischargeDispositionList"
                      [value]="item.Value">{{item.Desc}}</ng-option>
                  </ng-select>
                </div> -->
          <!-- <div class="col-md-4 p-0">
                  <input type="text" class="form-control height-normal"
                    id="dischargedisposition" formControlName="DischargeCondition" [readonly]="isDisabledOther">
                </div> -->
        </div>
        <div class="d-flex align-items-center mb-2">
          <div class="col-md-3 pl-0">
            <label for="indication-for-surgery" class="col-form-label"
              >Condition at discharge</label
            >
          </div>
          <div class="col-md-9 p-0">
            <textarea
              type="text"
              class="form-control"
              id="indication-for-surgery"
              formControlName="DischargeCondition"
            ></textarea>
          </div>
        </div>
        <div class="d-flex align-items-center mb-2">
          <div class="col-md-3 pl-0">
            <label for="indication-for-surgery" class="col-form-label"
              >Discharge reason</label
            >
          </div>
          <div class="col-md-9 p-0">
            <textarea
              type="text"
              class="form-control"
              formControlName="DischargeReason"
              id="indication-for-surgery"
            ></textarea>
          </div>
        </div>
        <div class="d-flex align-items-center mb-2">
          <div class="col-md-3 pl-0">
            <label for="indication-for-surgery" class="col-form-label"
              >Discharge and Follow-Up Instruction</label
            >
          </div>
          <div class="col-md-9 p-0">
            <textarea
              type="text"
              class="form-control"
              id="indication-for-surgery"
              formControlName="DischargeFollowipInstruction"
            ></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
