<div class="search-functionalitypl-0">
  <form action="" [formGroup]="formDetailGroup">
    <div
      class="tab-search-panel d-flex align-items-center justify-content-between"
    >
      <div class="w-100 d-flex align-items-center">
        <div class="date-function mr-4">
          <img src="assets/img/date-icon.svg" alt="" />
          <input
            #drp="bsDaterangepicker"
            bsDaterangepicker
            [bsConfig]="{
              rangeInputFormat: 'DD.MM.YYYY',
              dateInputFormat: 'DD.MM.YYYY',
              containerClass: 'daterangepicker',
              showWeekNumbers: false
            }"
            class="form-control"
            formControlName="DateRange"
            (ngModelChange)="onDateChange()"
          />
          <p *ngIf="this.admissionService.PhysicianOrders" class="m-0 d-flex h-100 align-items-center" (click)="allOrderRemoveDateFilter()">All Orders</p>
          <p *ngIf="this.admissionService.ProgressNotes" class="m-0 d-flex h-100 align-items-center" (click)="allOrderRemoveDateFilter()">All Notes</p>
        </div>
        <div class="search-functionality col-md-3 ml-3 pl-0">
          <img src="assets/img/pres-search-icon.svg" alt="" />
          <input
            type="text"
            (input)="onSearchChange($event)"
            formControlName="SearchData"
            placeholder="Search"
            class="form-control w-100"
            id="searchFilter"
          />
        </div>
        <div class="select-functionality text-left">
          <ng-select
            [searchable]="true"
            (ngModelChange)="onDateChange()"
            formControlName="SelectDropdown"
            placeholder="Occupational Group"
          >
            <ng-option
              *ngFor="let data of occupationalGroupData"
              [value]="data.Group"
              >{{ data.Text }}</ng-option
            >
          </ng-select>
        </div>
      </div>
      <i aria-hidden="true" class="fa fa-refresh refresh-icon cursor-pointer mr-3" (click)="resetFilter()"></i>
    </div>
  </form>
</div>
