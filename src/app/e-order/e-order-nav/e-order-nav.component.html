<div class="e-order-nav">
  <div class="container-fluid p-0">
    <div class="row m-0">
      <div class="col-md-11 pl-0">
        <div class="e-order-navigation">
          <ul *ngIf="eorderService.configurationoptionBackup">
            <li *ngIf="eorderService.configurationoptionBackup.Ordprofile">
              <a
                href="javascript:void(0)"
                (click)="eorderService.onNavigationClick('Ordprofile')"
                >Orders Profile</a
              >
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Clinicord">
              <a
                href="javascript:void(0)"
                (click)="eorderService.onNavigationClick('Clinical')"
                >Clinical Orders</a
              >
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Medicat">
              <a
                href="javascript:void(0)"
                (click)="eorderService.onNavigationClick('Medications')"
                >Medications</a
              >
            </li>
            <!-- <li *ngIf="eorderService.configurationoptionBackup.Quickord">
              <a href="javascript:void(0)">Quick Orders</a>
            </li> -->
            <li *ngIf="eorderService.configurationoptionBackup.Ordset">
              <a href="javascript:void(0)" (click)="eorderService.onNavigationClick('OrderSet')">Orders Sets</a>
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Doctfees">
              <a
                href="javascript:void(0)"
                (click)="eorderService.onNavigationClick('Fees')"
                >Fees and Services</a
              >
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Surgery">
              <a (click)="eorderService.onNavigationClick('Surgery')" href="javascript:void(0)">Surgery Order</a>
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Daycaseord">
              <a href="javascript:void(0)">Day-Case Order</a>
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Consultation">
              <a
                href="javascript:void(0)"
                (click)="eorderService.onNavigationClick('Consultation')"
                >Consultation Order</a
              >
            </li>
            <li *ngIf="eorderService.configurationoptionBackup.Admission">
              <a
                href="javascript:void(0)"
                (click)="eorderService.onNavigationClick('Admission')"
                >Admission Order</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="col-md-1 pr-0">
        <div
          class="e-order-settings d-flex flex-wrap justify-content-end align-items-center h-100"
        >
          <div class="e-order-refresh mr-2" (click)="eorderService.loadeOrderData()">
            <img _ngcontent-thf-c188="" src="assets/img/reload-icon.svg" alt="">
          </div>
          <a href="javascript:void(0)" (click)="openModal(configureoption)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <path
                d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336c44.2 0 80-35.8 80-80s-35.8-80-80-80s-80 35.8-80 80s35.8 80 80 80z"
              />

          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<ng-template #configureoption>
  <div class="e-order-configuration">
    <div class="modal-body">
      <div class="modal-inner-body" *ngIf="eorderService.configurationoption">
        <div class="modal-header d-flex p-0 py-2 align-items-center">
          <button type="button" class="btn btn-primary rounded-0">
            Configuration Options
          </button>
          <img
            src="assets/img/save.png"
            (click)="eorderService.saveConfiguration()"
            class="save-icon"
            width="19"
          />
        </div>
        <div class="checkbox-list">
          <h2>e-Order List</h2>
          <div class="checkbox-info d-flex flex-wrap">
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                name="eOrderList"
                id="Myord"
                (change)="changeOrderList($event, 'Myord')"
                [(ngModel)]="eorderService.configurationoption.Myord"
              />
              <label for="Myord">My Orders</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                name="eOrderList"
                id="Allords"
                (change)="changeOrderList($event, 'Allords')"
                [(ngModel)]="eorderService.configurationoption.Allords"
              />
              <label for="Allords">All Orders</label>
            </div>
          </div>
        </div>
        <div class="checkbox-list">
          <h2>Organization Unit</h2>
          <div class="checkbox-info d-flex flex-wrap">
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                name="Organization"
                id="Myou"
                (change)="changeOrganizationList($event, 'Myou')"
                [(ngModel)]="eorderService.configurationoption.Myou"
              />
              <label for="Myou">My OU</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                name="Organization"
                id="Allous"
                (change)="changeOrganizationList($event, 'Allous')"
                [(ngModel)]="eorderService.configurationoption.Allous"
              />
              <label for="Allous">All OUs</label>
            </div>
          </div>
        </div>
        <div class="checkbox-list">
          <h2>Medication Templates</h2>
          <div class="checkbox-info d-flex flex-wrap">
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Usrlvl"
                [(ngModel)]="eorderService.configurationoption.Usrlvl"
              />
              <label for="Usrlvl">User Level</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Deptlvl"
                [(ngModel)]="eorderService.configurationoption.Deptlvl"
              />
              <label for="Deptlvl">Global Level</label>
            </div>
          </div>
        </div>
        <div class="checkbox-list">
          <h2>Functions</h2>
          <div class="checkbox-info d-flex flex-wrap">
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Ordprofile"
                [(ngModel)]="eorderService.configurationoption.Ordprofile"
              />
              <label for="Ordprofile">Orders Profile</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Clinicord"
                [(ngModel)]="eorderService.configurationoption.Clinicord"
              />
              <label for="Clinicord">Clinical Orders</label>
            </div>
            <!-- <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Quickord"
                [(ngModel)]="eorderService.configurationoption.Quickord"
              />
              <label for="Quickord">Quick Orders</label>
            </div> -->
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Doctfees"
                [(ngModel)]="eorderService.configurationoption.Doctfees"
              />
              <label for="Doctfees">Fees and Services</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Medicat"
                [(ngModel)]="eorderService.configurationoption.Medicat"
              />
              <label for="Medicat">Medication</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Ordset"
                [(ngModel)]="eorderService.configurationoption.Ordset"
              />
              <label for="Ordset">Order Sets</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Surgery"
                [(ngModel)]="eorderService.configurationoption.Surgery"
              />
              <label for="Surgery">Surgery Order</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Daycaseord"
                [(ngModel)]="eorderService.configurationoption.Daycaseord"
              />
              <label for="Daycaseord">Day Case Order</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Consultation"
                [(ngModel)]="eorderService.configurationoption.Consultation"
              />
              <label for="Consultation">Consultation Order</label>
            </div>
            <div class="checkbox-inner d-flex align-items-center">
              <input
                type="checkbox"
                id="Admission"
                [(ngModel)]="eorderService.configurationoption.Admission"
              />
              <label for="Admission">Admission Order</label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
