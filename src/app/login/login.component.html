<form
  name="form"
  (ngSubmit)="f.form.valid && onSubmit()"
  #f="ngForm"
  novalidate
>
  <div class="fixed-background"></div>
  <div class="container">
    <div class="row h-100">
      <div class="col-12 col-md-10 mx-auto my-auto">
        <div class="card auth-card">
          <div class="position-relative image-side"></div>
          <div class="form-side">
            <a class="c-pointer"><span class="logo-single"></span></a>
            <div class="form-group">
              <label for="username" class="form-group has-float-label">
                <input
                  required=""
                  name="username"
                  [(ngModel)]="form.username"
                  required
                  #username="ngModel"
                  [ngClass]="{ 'is-invalid': f.submitted && username.errors }"
                  class="form-control"
                /><span>Username</span></label
              >
              <div
                *ngIf="username.errors && f.submitted"
                class="invalid-feedback"
              >
                Username is required!
              </div>
              <label for="password" class="form-group has-float-label">
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  [(ngModel)]="form.password"
                  required
                  minlength="6"
                  #password="ngModel"
                  [ngClass]="{ 'is-invalid': f.submitted && password.errors }"
                  type="password"
                  placeholder=""
                /><span>Password</span></label
              >
              <div
                *ngIf="password.errors && f.submitted"
                class="invalid-feedback"
              >
                <div *ngIf="password.errors['required']">
                  Password is required
                </div>
                <div *ngIf="password.errors['minlength']">
                  Password must be at least 6 characters
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                <button
                  triggers=""
                  class="btn btn-lg btn-multiple-state btn-primary btn-shadow"
                >
                  <div class="spinner d-inline-block">
                    <div class="bounce1"></div>
                    <div class="bounce2"></div>
                    <div class="bounce3"></div>
                  </div>
                  <span
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Everything went right!"
                    class="icon success"
                    ><i class="simple-icon-check"></i></span
                  ><span
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Something went wrong!"
                    class="icon fail"
                    ><i class="simple-icon-exclamation"></i></span
                  ><span class="label"> LOGIN </span>
                </button>
                <div
                  *ngIf="f.submitted && isLoginFailed"
                  class="alert alert-danger"
                  role="alert"
                >
                  Login failed: {{ errorMessage }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
