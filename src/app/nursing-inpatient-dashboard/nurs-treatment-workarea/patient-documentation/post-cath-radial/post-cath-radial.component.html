<h5 class="form-section">Post Cath - PCI Femoral Nursing</h5>
<form novalidate="" class="ng-untouched ng-pristine ng-valid">
  <div class="row mb-3">
    <div class="col-md-6" style="display: flex; align-items: baseline">
      <label for="date" class="form-label col-md-3 p-0">Date</label>
      <div class="header-date p-0 ">
        <span
          _ngcontent-ufq-c103=""
          style="
            position: relative;
            top: 32px;
                right: 40px;
            float: right;
            margin-top: -26px;
            font-size: 18px;
            z-index: 1;
          "
        >
          <img src="assets/img/Calender.svg" alt="" />
        </span>
        <input
          class="form-control ml-0 col-1"
          style="color: #000; border-radius: 8px"
          type="text"
          placeholder=""
          [minDate]=""
          [maxDate]=""  
          #dp="bsDatepicker"
          [bsValue]="CurrentDateAndTime"
          style="min-width: 200px;height:40px !important"
          bsDatepicker
          [bsConfig]="{
            showWeekNumbers: false,
            dateInputFormat: 'DD.MM.YYYY'
          }"
        />
    </div>
    </div>
    <div
      class="col-md-3"
      style="display: flex; align-items: baseline; gap: 10px"
    >
      <label for="time" class="form-label">Time</label
      ><input type="time" id="time" [value]="currentTime" class="form-control col-md-6" />
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-md-6" style="display: flex">
      <label for="physician" class="form-label col-md-3 p-0"
        >Physician Name</label
      >
      <ng-select
        [items]="physicians"
        bindLabel="name"
        bindValue="id"
        placeholder="Select Physician"
        [searchable]="false"
        style="min-width: 200px;"
      >
      </ng-select>
    </div>
    <div class="col-md-4 p-0 d-flex align-items-end">
      <input
        type="text"
        placeholder="Procedure"
        class="form-control me-2"
        autocomplete="off"
      />
    </div>
  </div>
  <div class="mb-3 col-md-6 p-0" style="display: flex">
    <label class="form-label col-md-3 p-0 p-0">Site</label><br />
    <div>
        <div class="form-check form-check-inline">
          <span class="col-md-4 p-0"> <input type="checkbox" id="rtFemoral" class="form-check-input" /><label
            for="rtFemoral"
            class="form-check-label"
            >Rt. Radial</label
          >
        </span>
         <span class="col-md-4 p-0">
          <input type="checkbox" id="ltFemoral" class="form-check-input" /><label
            for="ltFemoral"
            class="form-check-label"
            >Lt. Radial</label
          >
         </span>
         <div class="col-md-6 p-0"></div>
         <label class="col-md-3"> Air in Radial band</label>        
         <span class="col-md-4"> <input type="text" id="ltFemoral" class="form-control ml-4 mr-3" /></span> 
         <label class="ml-4">ml</label>
        </div>
    </div>
  </div>
  <div class="d-flex mb-3 col-md-6 p-0">
    <label for="lastAct" class="form-label col-md-3 p-0">Last ACT</label
    ><input type="text" id="lastAct" class="form-control" />
  </div>
  <div class="form-container mt-2">
    <!-- Vital Signs Table -->
    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle">
        <thead style="background-color: #e4edf5; color: black">
          <tr>
            <th>Last ACT</th>
            <th>2 Hr</th>
            <th>4 Hr</th>
            <th>6 Hr</th>
          </tr>
        </thead>
        <tbody>
          <!-- Sample rows -->
          <tr>
            <td></td>
            <td colspan="1"></td>
          </tr>
          <tr>
            <td></td>
            <td colspan="1"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="form-container mt-3">
    <!-- Vital Signs Table -->
    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle">
        <thead style="background-color: #e4edf5; color: black">
          <tr>
            <th>Vitals/Site</th>
            <th>15 min</th>
            <th>30 min</th>
            <th>45 min</th>
            <th>1 Hr</th>
            <th>1.5 Hr</th>
            <th>2 Hr</th>
            <th>2.5 Hr</th>
            <th>3 Hr</th>
            <th>4 Hr</th>
            <th>5 Hr</th>
            <th>6 Hr</th>
          </tr>
        </thead>
        <tbody>
          <!-- Sample rows -->
          <tr>
            <td>Pulse (bpm)</td>
            <td colspan="1"></td>
          </tr>
          <tr>
            <td>BP (mmHg)</td>
            <td colspan="1"></td>
          </tr>
          <tr>
            <td>Resp. (bpm)</td>
            <td colspan="1"></td>
          </tr>
          <tr>
            <td>Temp (°C)</td>
            <td colspan="1"></td>
          </tr>
          <tr>
            <td>O2 SAT (%)</td>
            <td colspan="1"></td>
          </tr>
          <tr>
            <td>Access Site Assessment</td>
            <td colspan="1"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</form>
