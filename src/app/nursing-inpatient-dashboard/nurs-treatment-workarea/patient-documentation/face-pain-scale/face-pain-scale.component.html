<div class="facepain">
  <div class="facepain-box">
    <div class="row ml-0 mr-0 selection-section ">
      <div class="col-md-2" *ngFor="let item of FacePainResponse">
        <div class="d-flex justify-content-center">
          <img class="cursor-pointer" [src]="item.image" [alt]="item.image" [id]="item.keyId"
            (click)="selectRadio(item.keyId, item.value, item.text)">
        </div>
        <div class="d-flex justify-content-center" (click)="setFacePainValue(item.value, item.text)">
          <input class="cursor-pointer" type="radio" [name]="item.text" [id]="item.keyId" [value]="item.value"
            [(ngModel)]="totalScore" />
          <label class="ml-2" [for]="item.keyId">{{item.text}}</label>
        </div>
      </div>
    </div>
    <div class="splitter"></div>
    <div class="scale-result">
      <h4 class="mb-4">Scale Result</h4>
      <div class="row m-0">
        <div class="col-md-3">
          <div class="mb-2 d-flex align-items-center">
            <label class="mr-5">Total Score</label>
            <input class="form-control w-50" [(ngModel)]="totalScore" disabled />
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-2 d-flex justify-content-between">
            <input placeholder="Deep coma or brain death" class="form-control" [(ngModel)]="facePainDescription"
              disabled />
          </div>
        </div>
      </div>
      <div class="comment-input d-flex mt-4 align-items-center">
        <label>Comments</label>
        <textarea class="form-control" [(ngModel)]="comment" [disabled]="dockeyValue"></textarea>
      </div>
    </div>
  </div>
</div>
