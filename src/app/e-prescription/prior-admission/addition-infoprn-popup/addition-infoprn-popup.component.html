<ng-template #additionalInfoprn>

    <textarea type="text" [value]="isDefaultComment" #additionalInfoprn
      class="w-100" [readonly]="true"></textarea>
  </div>
  <div class="button-group d-flex justify-content-end p-3">
    <!-- <button (click)="updateAdditionalInfo(additionalInfoprn.value)"
      class="d-flex
      align-items-center mr-2"><img src="assets/img/update-icon.svg"
        class="mr-1">Update</button> -->
    <button (click)="cancelAdditionalInfo()" class="d-flex align-items-center"><img
        src="assets/img/cancel-icon.svg" class="mr-1">Cancle</button>
  </div>
</ng-template>
