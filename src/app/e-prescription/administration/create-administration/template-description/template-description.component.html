<ng-template #templatePopup>
  <div>
    <div>
      <h3 class="p-2 font-weight-bold save-bg">Save as Template</h3>
      <div class="p-3">
        <!-- <div class="d-flex align-items-center mb-2">
          <p class="m-0 mr-2 mb-1 font-weight-bold">Name:</p>
          <input type="text" class="form-control " placeholder="Enter template Name" [(ngModel)]="templateDescription" />
        </div> -->
        <div class="d-flex align-items-center mb-2 popup">
          <p class="m-0 mr-2 mb-1 font-weight-bold">Desc:</p>
          <input type="text" class="form-control" placeholder="Enter template Desc" [(ngModel)]="templateName" />
        </div>
      </div>
      <div class="button-bg d-flex justify-content-lg-end align-items-center p-2">
        <button type="text" class="btn btn-primary rounded-0 add-btn mr-3" (click)="savePopup()">
          Save
        </button>
        <button type="text" class="btn btn-primary rounded-0 close-btn mr-3" (click)="closePopup()">
          Close
        </button>
      </div>
    </div>
  </div>
</ng-template>
