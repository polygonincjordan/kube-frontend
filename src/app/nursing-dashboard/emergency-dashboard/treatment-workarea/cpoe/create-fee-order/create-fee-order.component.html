<div class="e-order-history-content">
  <div class="e-order-history-panel">
    <div class="e-order-inner-panel">
      <div class="e-order-title">
        <h4>Fees Orders</h4>
      </div>
      <div class="e-order-info">
        <div class="history-table table-responsive edit-history-table m-0">
          <table class="table" *ngIf="customData && customData.length">
            <thead>
              <tr>
                <th class="border-0 text-center">Service Description</th>
                <th class="border-0 text-center">Desired Date</th>
                <th class="border-0 text-center">Price</th>
                <th class="border-0 text-center">Comments</th>
                <th class="border-0 text-center"></th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngIf="customData && customData.length">
                <tr *ngFor="let element of customData">
                  <td class="align-middle border-0 w-30">
                    <span class="d-flex align-items-center p-0">
                      <span
                        class="input-text-field d-inline-block align-top w-100"
                      >
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="element.text"
                          disabled="true"
                        />
                      </span>
                    </span>
                  </td>
                  <td class="align-middle border-0">
                    <span class="d-inline-block align-top w-100">
                      <input
                        type="date"
                        class="form-control"
                        [(ngModel)]="element.date"
                      />
                    </span>
                  </td>
                  <td class="align-middle border-0 w-20">
                    <span class="d-inline-block align-top w-100">
                      <div class="d-flex">
                        <input
                          type="number"
                          class="form-control"
                          [(ngModel)]="element.newprice"
                          [disabled]="element.price === 'Manual Fees' || element.Manual ? false : true
                          "/>
                        <div class="unite-text">
                          <label class="m-0">{{ element.Unit }}</label>
                          <!-- <input type="text" class="form-control" [(ngModel)]="element.Unit" [disabled]="true"/> -->
                        </div>
                      </div>
                    </span>
                  </td>
                  <td class="align-middle border-0">
                    <span class="d-inline-block align-top w-100">
                      <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="element.note"
                      />
                    </span>
                  </td>
                  <td class="align-middle border-0">
                    <span
                      class="trash-icon"
                      (click)="eorderService.onDeleteOrder(element)"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 448 512"
                      >
                        <path
                          d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"
                        />
                      </svg>
                    </span>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
