<div>
  <div class="d-flex justify-content-between align-items-center">
    <div class="w-25">
      <div class="search-functionality  position-relative  ml-3 pl-0">
        <img src="assets/img/pres-search-icon.svg" alt="">
        <!-- <input placeholder="Search..." class="form-control radius-none border-left-0 rounded-0" autocomplete="off" role="combobox"
          aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" (keydown.enter)="
          CpoeService.searchMedData(searchMedString)" (input)="CpoeService.searchMedData(searchMedString)" [(ngModel)]="searchMedString" /> -->
        <input placeholder="Search..." class="form-control radius-none rounded-0" autocomplete="off" role="combobox" aria-autocomplete="list"
          aria-expanded="false" aria-haspopup="true" (keydown.enter)="
          CpoeService.searchlistData(searchString)
          " (input)="CpoeService.searchlistData(searchString)" [(ngModel)]="searchString" />
      </div>
    </div>
    <div>
      <button type="button" class="btn btn-color rounded-lm  ml-2" (click)="CpoeService.onCreateOrder()">
        Create e-Order
      </button>
      <button type="button" class="btn btn-color rounded-lm ml-2" (click)="CpoeService.onCancelOrder()">
        Cancel
      </button>
      <button type="button" class="btn btn-color-data rounded-lm ml-2" (click)="CpoeService.loadeOrderData()">
        <img src="assets/img/reload-icon.svg" alt="" height="15px" class="mr-1">
        Refresh
      </button>
    </div>
  </div>

  <!-- <div style="border-bottom: 10px solid #f2f4f6;" class="w-100 mt-3"></div> -->
  <div style="border-bottom: 10px solid #f2f4f6;
width: 103%;
position: relative;
left: -21px;" class=" mt-3"></div>

  <div class="emr-border p-3 mt-3 d-flex justify-content-between" *ngIf="!showPatients">
    <div class="row w-100 mr-1">
      <div class="col-4">
        <div class="emer-color">
          <div class="emer-data">
            Loboratory
          </div>
          <div class="p-3 overflow-lab ">
            <app-e-order-searchlist [customData]="CpoeService.labOrdersSearchList" type="LAB"></app-e-order-searchlist>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="emer-color">
          <div class="emer-data">
            Radiology
          </div>
          <div class="p-3 overflow-lab">
            <app-e-order-searchlist [customData]="CpoeService.radOrdersSearchList" type="RAD"></app-e-order-searchlist>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="emer-color">
          <div class="emer-data">
            Procedures and packages
          </div>
          <div class="p-3 overflow-lab">
            <app-e-order-searchlist [customData]="CpoeService.procedureSearchList" type="PROC"></app-e-order-searchlist>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="pl-0 padding-data pr-0">
        <div class="lab-border mb-2 c-pointer" (click)="showhidePatients()">
          <div class="img-color p-2 mb-2">
            <img src="assets/img/Laboratory.svg" alt="" height="25">
          </div>
          <div class="fliter-data p-2 d-flex justify-content-center align-items-center font-weight-bolder">
            <p class="p-0 m-0">{{CpoeService.checkedlabOrdersCount}}</p>
          </div>
        </div>
        <div class="lab-border mb-2 c-pointer" (click)="showhidePatients()">
          <div class="img-color p-2 mb-2">
            <img src="assets/img/Radiology.svg" alt="" height="25">
          </div>
          <div class="fliter-data p-2 d-flex justify-content-center align-items-center font-weight-bolder">
            <p class="p-0 m-0">{{CpoeService.checkedradOrdersSearchCount}}</p>
          </div>
        </div>
        <div class="lab-border mb-2 c-pointer" (click)="showhidePatients()">
          <div class="img-color p-2 mb-2">
            <img src="assets/img/Proceduresandpackages.svg" alt="" height="25">
          </div>
          <div class="fliter-data p-2 d-flex justify-content-center align-items-center font-weight-bolder">
            <p class="p-0 m-0">{{CpoeService.checkedprocedureSearchCount}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="emr-border p-3 mt-3 row" *ngIf="showPatients">
    <div class="col-2">
      <div class="p-2 lab-border mb-2 c-pointer d-flex justify-content-between align-items-center w-100" (click)="showhidePatients()">
        <div class="img-color p-2 mr-2">
          <img src="assets/img/Laboratory.svg" alt="" height="25">
        </div>
        <div class="p-2 fliter-Lab w-100">
          <p class="p-0 m-0 font-size">Laboratory</p>
        </div>
      </div>
      <div class="p-2 lab-border mb-2 c-pointer d-flex justify-content-between align-items-center w-100" (click)="showhidePatients()">
        <div class="img-color p-2 mr-2">
          <img src="assets/img/Radiology.svg" alt="" height="25">
        </div>
        <div class="p-2 fliter-Lab w-100">
          <p class="p-0 m-0 font-size">Radiology</p>
        </div>
      </div>
      <div class="p-2 lab-border mb-2 c-pointer d-flex justify-content-between align-items-center w-100" (click)="showhidePatients()">
        <div class="img-color p-2 mr-2">
          <img src="assets/img/Proceduresandpackages.svg" alt="" height="25">
        </div>
        <div class="p-2 fliter-Lab w-100">
          <p class="p-0 m-0 font-size">Procedures And Packages</p>
        </div>
      </div>
    </div>
    <div class="col-10">
      <div class=" p-3 m-0 Result-color font-weight-bolder d-flex justify-content-between align-items-center">
        <p class="p-0 m-0">CPOE Result</p>
        <img src="assets/img/CloseTab.svg" alt="" height="20" (click)="CpoeService.onCancelOrder()">
      </div>
      <div class="e-order-list" *ngIf="CpoeService.switchVal.name === 'eorders' || CpoeService.switchVal.name === 'history-data'">
        <app-create-e-order [customData]="CpoeService.eOrders"></app-create-e-order>
      </div>
    </div>
  </div>
</div>
<organization-unit #organizationUnit></organization-unit>
