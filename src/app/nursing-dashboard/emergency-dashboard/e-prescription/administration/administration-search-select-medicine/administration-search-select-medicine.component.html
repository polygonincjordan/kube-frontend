<ng-container *ngIf="group" [formGroup]="group">
  <ng-select class="d-grid-am" formControlName="Result_Drug_Name"
    (keyup)="someMethod($event, searchTypeOnKeyEnter)"[markFirst]="false"
    [title]="group.get('Result_Drug_Name').value !== null ?
    group.get('Result_Drug_Name').value : ''" [typeahead]="searchTerm"
    (change)="broadcastEvent($event)"
    [ngClass]="group.touched &&
    group.get('Result_Drug_Name').errors && isSubmitted ?
    'ep-error-message': ''">
    <ng-option
      *ngFor=" let medicationDrug of medicationDrugList"
      [value]="medicationDrug">
      {{ medicationDrug.Drugname }}
    </ng-option>
  </ng-select>
</ng-container>
