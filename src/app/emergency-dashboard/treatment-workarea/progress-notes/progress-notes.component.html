<div class="container-fluid h-100" style="
padding: 10px;">
  <div class="progress-header">
    <div [formGroup]="progressNoteForm" class="">
      <div class="d-flex justify-content-between" style="gap: 6px;">
        <div class="header-date">
          <span class='pn-input-title z-indexlabel'>Date </span>
          <span _ngcontent-ufq-c103="" style="
                  position: relative;
                  top: 30px;
    right: 4px;
    float: right;
              margin-top: -26px;
              font-size: 18px;
              
            ">
            <img src="assets/img/Calender.svg" alt="" />
          </span>

          <input formControlName="ActionDate" class="form-control" style="color: #000; border-radius: 8px" type="text"
            placeholder="" [minDate]="" [maxDate]="" #dp="bsDatepicker" bsDatepicker [bsConfig]="{
              showWeekNumbers: false,
              dateInputFormat: 'DD.MM.YYYY'
            }" />
        </div>
        <div class="header-time" style="position: relative;width: 10%;">
          <span class='pn-input-title z-indexlabel'>Time </span>
          <span _ngcontent-ufq-c103="" style="
                  position: relative;
    top: 33px;
    left: -7px;
    float: right;
              margin-top: -26px;
              font-size: 18px;
              
            ">
            <img src="assets/img/Time.svg" alt="" />
          </span>
          <input type="text" class="form-control" aria-label="24hr format" [ngxTimepicker]="fullTime" [format]="24"
            formControlName="ActionTime" style="
              height: 38px;
             
              
              color: #000;
             
              border-radius: 8px;
            " />
          <ngx-material-timepicker #fullTime
            style="z-index: 9999 !important; position: relative !important"></ngx-material-timepicker>
        </div>
        <div class="header-occupational">
          <ng-select [searchable]="true" (ngModelChange)="onDateChange()" formControlName="ProfGroup"
            placeholder="Occupational Group">
            <ng-option *ngFor="let data of occupationalGroupData" [value]="data.Group">{{ data.Text }}</ng-option>
          </ng-select>
        </div>
        <div class="header-category">
          <ng-select [searchable]="true" (ngModelChange)="onDateChange()" formControlName="Category"
            placeholder="Category">
            <ng-option *ngFor="let category of categoryList" [value]="category.CatId">{{ category.CatText }}</ng-option>
          </ng-select>
        </div>
        <div class="header-template">
          <ng-select (change)="onTempleteSelect()" [ngModelOptions]="{standalone: true}" [(ngModel)]="templteContent"
            placeholder="Template">
            <ng-option *ngFor="let data of templateList" [value]="data">{{
              data.Keyword
              }}</ng-option>
          </ng-select>
        </div>
        <div class="header-btn" (click)="showOrderTemplateModal(saveTemplate, 'saveTemplate')">
          <button
            type="button"
            class="create-progress"
            style="width: 112px;"
          >
            Save Template
          </button>
        </div>
        <div class="header-btn" (click)="cancelProgressNote()">
          <button type="button" class="create-progress">
            Cancel
          </button>
        </div>
        <div class="header-btn">
          <button (click)="createProgressNote()" type="button" class="create-progress">
            Create
          </button>
        </div>
      </div>
      <div class="progress mt-3">
        <textarea formControlName="Text" class="form-control" placeholder="Write a today progress"></textarea>
      </div>
    </div>
  </div>

  <div class="progress-notes-list">
    <app-progress-note-list (copyProgressNotes)="copyProgressNotesEvent($event)"
      (reloadPhyOrderList)="reloadPhyOrderListEvent($event)"
      [ProgressNotesList]="ProgressNotesList | filter : searchString"></app-progress-note-list>
  </div>
</div>

<ng-template #saveTemplate>
  <div class="modal-body p-3">
    <form  class="order-pop-template" [formGroup]="saveTemplateForm1">
      <div class="order-form d-flex mt-2 mb-2">
        <input
          name="Templatetxt"
          formControlName="Templatetxt"
          placeholder="Template Key"
          type="text"
          class="form-control"
          style="margin-right: 5px"
        />
        <input
         type="text"
         formControlName="Templatelevel"
          class="form-control"
          value="User Level"
          style="pointer-events: none;"
        />
      </div>
      <div class="text-right mt-3">
        <button
          type="button"
          class="create-progress"
          (click)="saveProgressTemplateData(templateNameUpdate, 'saveTemplate')"
          style="
            border: 1px solid;
            background: #3b82f6;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 700;
          "
        >
          Save Template
        </button>
      </div>
    </form>
  </div>
</ng-template>

<ng-template #templateNameUpdate>
  <div class="modal-body p-0" style="padding: 0 !important;">
    <form [formGroup]="saveTemplateForm1" class="">
      <div class="update-template-title">
        <h4 class="m-0 pl-3">
          Progress Notes Template
          <span *ngIf="notAuthUpdateTemp">- Update</span>
        </h4>
      </div>
      <div class="p-3">
        <div class="update-template-contant">
          <p>
            {{
              notAuthUpdateTemp
                ? "Template Name already exists, Do you want to update the existing one?"
                : "Template's name already exists, please change name to save."
            }}
          </p>
        </div>
        <div class="text-right mt-3">
          <button
            type="button"
            class="update-Exsiting mr-3"
            *ngIf="notAuthUpdateTemp"
            (click)="updateExsitingTempName()"
          >
            Update Existing
          </button>
          <button
            type="button"
            class="update-Exsiting"
            (click)="modalRefUpdateName.hide()"
          >
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>
</ng-template>
