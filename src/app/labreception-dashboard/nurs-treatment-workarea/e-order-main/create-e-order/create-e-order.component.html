
      <ng-template #configureoption>
        <div class="modal-body">
          <div class="modal-inner-body"></div>
        </div>
      </ng-template>
      <ng-template #additionalInfo>
        <div class="additional-input additional-input p-3">
          <label for="additionalInfo w-100">Additional Information</label>
          <textarea type="text" [(ngModel)]="selectedData.note" #additionalInfo
            class="w-100"></textarea>
        </div>
        <div class="button-group d-flex justify-content-end p-3">
          <button  class="d-flex
            align-items-center mr-2" (click)="modalRef.hide()">Save</button>
          <button class="d-flex align-items-center" (click)="modalRef.hide()">Cancel</button>
        </div>
      </ng-template>


      <div class="service-form">
        <div class="card"  *ngFor="let keyData of customData">
          <div class="card-header">
            <h3>LAB  Orders</h3>
          </div>
          <div class="card-body">
            <div class="card-content">
              <div class="history-table table-responsive edit-history-table m-0">
                <table class="table">
                  <thead>
                    <tr>
                      <th colspan="1" scope="col">Service Description</th>
                      <th colspan="1" scope="col">Desired Date</th>
                      <th colspan="1" scope="col">Service Time</th>
                      <th colspan="1" scope="col">Fasting</th>
                      <th colspan="1" scope="col">Localization</th>
                      <th colspan="1" scope="col">Comments</th>
                      <th colspan="1" scope="col"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <ng-container>
                      <tr *ngFor="let element of keyData.groupItem">
                        <td class="align-middle border-0 w-30">
                          <span class="d-flex align-items-center p-0">
                            <span
                              class="input-text-field d-inline-block align-top w-100">
                              <input
                                type="text"
                                class="form-control"
                                [(ngModel)]="element.text"
                                disabled="true"
                                [title]="element.text"
                                />
                            </span>
                          </span>
                        </td>
                        <td class="align-middle border-0">
                          <span class="d-inline-block align-top w-100">
                            <input
                              type="date"
                              class="form-control input-type-date"
                              min="{{ element.date }}"
                              [(ngModel)]="element.date"
                              />
                          </span>
                        </td>
                        <td class="align-middle border-0">
                          <span class="d-inline-block align-top w-100">
                            <input
                              type="time"
                              class="form-control input-type-time"
                              [(ngModel)]="element.time"
                              />
                          </span>
                        </td>
                        <td class="align-middle border-0">
                          <span class="d-inline-block align-top w-100 text-center">
                            <input
                              type="checkbox"
                              class="checkbox-input"
                              [checked]="element.isFastingRequired"
                              [(ngModel)]="element.isFastingRequired"
                              />
                          </span>
                        </td>
                        <td class="align-middle border-0 w-15 mw-small">
                          <span class="align-top w-100">
                            <!-- <select id="localization-select" class="form-control input-type-select" [(ngModel)]="element.localization">
                              <option *ngFor="let localElement of element.locationtype" [value]="localElement.code">
                                {{localElement.description}}</option>
                            </select> -->
                            <ng-select
                            [appendTo]="'body'"
                            [dropdownPosition]="'bottom'"
                              [searchable]="true"
                              [(ngModel)]="element.localization">
                              <ng-option
                                *ngFor="let localElement of element.locationtype"
                                [value]="localElement.code">{{
                                localElement.description }}
                              </ng-option>
                            </ng-select>
                          </span>
                        </td>
                        <td class="align-middle border-0">
                          <span class="d-inline-block align-top w-100">
                            <input
                              type="text"
                              class="form-control"
                              [(ngModel)]="element.note"
                              [title]="element.note"
                              (click)="openComments(additionalInfo,element)"
                              />
                          </span>
                        </td>
                        <td class="align-middle border-0">
                          <div class="trash-icon" (click)="eorderService.onDeleteOrder(element)">
                            <img src="./assets/img/Delete.svg">
                          </div>
                          </td>
                        </tr>
                      </ng-container>
                    </tbody>
                  </table>
                </div>
            </div>
          </div>
        </div>
      </div>
