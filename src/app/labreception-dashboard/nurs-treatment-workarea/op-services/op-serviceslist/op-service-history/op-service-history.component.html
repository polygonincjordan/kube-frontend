<div class="service-form">
  <div class="card">
    <div class="card-header">
      <h3>Services History</h3>
    </div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
          <tr>
            <th colspan="4" scope="col">Service Description</th>
            <th colspan="1" scope="col">Date</th>
            <th colspan="1" scope="col">Time</th>
            <th colspan="1" scope="col">Status</th>
            <th colspan="1" scope="col">Comment</th>
            <th colspan="1" scope="col">Created By</th>
            <th colspan="1" scope="col">
              <div class="d-flex align-items-center justify-content-between">
                <div>Action</div>
              </div>
            </th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor=" let item of orderHistory let i = index">
            <tr [id]="i">
              <td colspan="4">
                <input class="form-control " [value]="item.Ktxt1" type="text" [disabled]="true" />
              </td>
              <td colspan="1">
                <input class="form-control " [value]="item.date" type="text" [disabled]="true" />
              </td>
              <td colspan="1">
                <input class="form-control " [value]="item.time" type="text" [disabled]="true" />
              </td>
              <td colspan="1">
                <input class="form-control " [value]="item.Waers" type="text" [disabled]="true" />
              </td>
              <td colspan="1">
                <input class="form-control " [value]="item.Remarks" type="text" [disabled]="true" />
              </td>
              <td colspan="1">
                <input class="form-control " [value]="item.Erusr" type="text" [disabled]="true" />
              </td>
              <td style="text-align: center">
                <div class="dropdown">
                  <i class="fa fa-ellipsis-v fa-lg   dropdown-toggle" aria-hidden="true" style="cursor: pointer"
                    id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></i>
                  <!-- <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                    <a class="dropdown-item c-pointer">Execute</a>
                  </div> -->
                </div>
              </td>
            </tr>
          </ng-container>
        </tbody>
        <tfoot *ngIf="orderHistory.length <= 0">
          <tr>
            <td colspan="11">
              <div class="pagination-container text-center p-3">
                No Record Found!
              </div>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
